# daily/social.toml——日常社交指令
# 效果用 settle 公式（base = timeCost + 30 对齐 erArk），不写数值

[[instructions]]
id = "chat"
label = "聊天"
type = "daily"
priority = 10
time_cost = 10
premises = ["HAVE_TARGET", "T_NORMAL"]
effects = [
  { type = "settle_favorability" },
  { type = "settle_state", params = { state = "好意" } },
  { type = "settle_state", params = { state = "屈服" } },
]
talk_scene = "chat"

