# ═══════════════════════════════════════════════════════════════════
# definitions/abilities.toml —— 第②层：能力定义（新增）
# h-core 已提供全套等级能力（技巧/感度/刻印/性技…）；这里示范新增 mod 自定义能力。
# 角色数据里写 abilities = { "吐纳术" = 3 } 前，必须先在此定义。
#
# 字段字典（每个字段能填什么）：
#   name / description：显示名/说明（自由填）
#   type："active"（主动使用，配合 time_cost/condition）/ "passive"（被动生效）
#   max_level：等级上限——0 = 无等级能力（存 {level:1, xp:null}）；>0 = 升级能力
#         （存 {level, xp}，xp 由 gain_ability_xp 效果增加）
#   tags：自由字符串【数组，可多个】——标签是插件按类型查询能力的通道：
#         combat-wuxia 查 "combat_active"/"sword"/"internal"；其他插件可查任意标签。
#         ⚠️ 没有插件查询的标签 = 无害但没人用（h-core 默认能力标签如 "abl"/"h_mark"）
#   effects：被动效果【数组，效果类型见 docs/effect-system.md】——
#         active 能力使用/被动能力常驻时的效果（示例：每级 +5 攻击）
#   time_cost：主动使用耗时（分钟）；condition：主动使用条件（条件表达式）
#   xp_curve："linear"/"exponential"/"custom"（升级曲线）
#   xp_per_level：linear/exponential 填数字（每级 XP）；custom 填【数组】
#         （如 [100, 200, 400, 800] = 各级所需 XP）
#   [[unlocks]]：技能树——at_level 达成时自动解锁子能力/天赋（引用的
#         ability/talent 必须已定义）
# ═══════════════════════════════════════════════════════════════════

[abilities."吐纳术"]
name = "吐纳术"
description = "江湖基础内功心法，打坐调息用"
type = "passive"
max_level = 10
tags = ["internal"]
xp_curve = "linear"
xp_per_level = 100
# 被动效果示例（取消注释即生效）：每级 +2 气血上限
# effects = [{ type = "modify_attribute", params = { attr = "气血", value = 2 }, target = "self" }]

# 技能树：升到 5 级自动解锁「龟息功」（ability-progression 插件执行 unlocks）
[[abilities."吐纳术".unlocks]]
at_level = 5
ability = "龟息功"

[abilities."龟息功"]
name = "龟息功"
description = "吐纳术进阶，气血恢复更快"
type = "passive"
max_level = 5
tags = ["internal"]

# ── 写法变体：max_level = 0 的无等级能力（存 {level:1, xp:null}，不升级）──
# 适合"会/不会"型能力（如 轻功、暗器 这类只问有没有的）：
# [abilities."轻功"]
# name = "轻功"
# type = "passive"
# max_level = 0
# tags = ["movement"]
# 角色数据写法：abilities = { "轻功" = 1 }（有）或 0/不写（无）

# ── 写法变体：xp_per_level 数组（xp_curve = "custom"）──
# 各级所需经验不同：xp_curve = "custom" + xp_per_level = [100, 200, 400, 800]
# （linear/exponential 则只填一个数字，每级固定）
# 写法 A：linear + 数字 → 每级 100 XP
# 写法 B：custom + 数组 → 第 1 级 100、第 2 级 200、第 3 级 400…

# ═══════════════════════════════════════════════════════════════════
# 条件驱动升级示范（mode = "condition"，2026-08-11 成长系统）
# 与上面的 XP 模式（gain_ability_xp 即时升级）不同：condition 模式在结算点
# （睡眠 / H结束）按 upgrades 逐级检查 needs，满足才升——erArk 式升级。
# 字段说明：
#   mode = "condition"：启用条件驱动（缺省 "xp"）
#   [[upgrades]]：第 i 条 = 从 i 级升 i+1 级的需求；条数 = 值域上限（缺条不可升）
#   needs：主需求（全部满足才升）；backup_needs：主不满足时备选（任一满足即可）
#   need 类型（type 字段）：
#     ability      → 能力等级达标   { type = "ability", id = "亲密", value = 2 }
#     talent       → 拥有该素质     { type = "talent", id = "剑骨" }
#     juel         → 宝珠数量达标    { type = "juel", id = 12, value = 100 }（升级时消耗）
#     experience   → 经验数值达标    { type = "experience", id = 0, value = 5 }
#                    （erArk 经验数字 id 直通：0=皮肤经验 42=口交经验 141-152=体位…）
#     favorability → 好感度达标      { type = "favorability", value = 60 }
#     trust        → 信赖度达标      { type = "trust", value = 50 }
#   extra_needs：能力级附加判定（每级都检查；ability_sum = 带某 tag 的能力等级之和
#     ≥ 当前等级 × per_level，per_level_npc 可另设 NPC 倍率——erArk 技巧升级同款）
#   sex_need：性别限定（-1 通用 / 0 男限定 / 1 女限定，erArk 原值）
# ═══════════════════════════════════════════════════════════════════

[abilities."房中术"]
name = "房中术"
description = "双修之术，需性技与亲密达标方可精进（条件驱动升级示范）"
type = "passive"
max_level = 3
tags = ["abl"]
mode = "condition"
sex_need = -1
# 附加判定：内功（internal tag）能力等级之和 ≥ 当前等级×2（每级升级前都检查）
extra_needs = [{ type = "ability_sum", tag = "internal", per_level = 2 }]

[[abilities."房中术".upgrades]]
# 0→1：皮肤经验 ≥ 5（E 类型，数字 id 直通）
needs = [{ type = "experience", id = 0, value = 5 }]

[[abilities."房中术".upgrades]]
# 1→2：欲情珠(12) ≥ 100（升级时消耗）+ 亲密 ≥ 2；备选：好感度 ≥ 60
needs = [{ type = "juel", id = 12, value = 100 }, { type = "ability", id = "亲密", value = 2 }]
backup_needs = [{ type = "favorability", value = 60 }]

[[abilities."房中术".upgrades]]
# 2→3：拥有天生神力 + 信赖 ≥ 50
needs = [{ type = "talent", id = "天生神力" }, { type = "trust", value = 50 }]
