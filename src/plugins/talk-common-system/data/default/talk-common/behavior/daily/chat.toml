# chat 指令默认通用口上（插件默认层，Layer 1）
# ============================================================
# 语义：原生通用口上 = 角色通用口上（character-dialogue.toml）的默认层。
#   mod 未写 scene="chat" 的角色通用口上 → dialogue-system 用本词条兜底；
#   mod 写了 → mod 内容胜出（mod 可整体覆盖：definitions/talk-common/ 下任意路径，
#   variable 同名即替换，见 docs/mod-file-guide.md）。
# 来源: erArk data/talk/daily/chat/chat.csv（行为级口上，adv_id=0 通用层）
# 占位符: {Name}→{player.name}（发起者） {TargetName}→{character.name} {SceneName}→{location.name}
# 去世界观处理（2026-08-17）：世界观内容句（龙门/罗德岛/整合运动/源石病/天灾等）
#   → "聊天指令通用口上 N" 占位，待手写替换。
# 约束：本目录（behavior/）只放非 H 行为默认口上；H 行为默认文本走行为地文（getBehaviorText）。

variable = "chat"
description = "聊天指令默认通用口上（角色通用口上 Layer 1 兜底，mod 可覆盖）"

[[entries]]
context = "{player.name}与{character.name}聊了一会儿天。"

[[entries]]
context = "{player.name}在{location.name}与{character.name}闲聊了一会儿。"

[[entries]]
context = "{player.name}对{character.name}分享了最近的见闻。"

[[entries]]
context = "{player.name}对{character.name}表示关心。"

[[entries]]
context = "{player.name}对{character.name}讲了个冷笑话，真的很冷。"

[[entries]]
context = "{player.name}与{character.name}闲聊了一会儿关于天气的话题。"

[[entries]]
context = "{player.name}与{character.name}闲聊了一会儿。"

