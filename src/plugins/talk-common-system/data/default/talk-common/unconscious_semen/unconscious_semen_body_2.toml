# 无意识醒来精液口上（睡奸/时停/催眠通用——settle_unconscious_semen_and_cloth 触发）
# 来源：erArk data/talk/system/second_unconscious_semen.csv（2026-08-16 转换）
# 部位编号 = 引擎 BODY_PART_CID 体系（非 erArk 编号）：0 头发 1 面 2 嘴 3 胸 5 手 6 阴道
#   7 子宫 8 肛 9 脚 10 尿道 11 腿；erArk 映射 9→10 / 10→11 / 11→9；
#   跳过 4 腋 / 12 尾巴 / 13 角（引擎无对应部位，grill 定案）
# 触发：h-npc-ai getText('in_unconscious_cum_on_body_{引擎编号}', targetId) → {Name} 替换
# ⚠️ mod 可覆盖（talk-common 合并语义：mods/{mod}/definitions/talk-common/ 同名 variable 覆盖）
# 原文为第三人称"她"视角（方舟向）——武侠 mod 如需改人称/文风，覆盖本文件即可

# ── 嘴（引擎编号 2；erArk 2）──
variable = "in_unconscious_cum_on_body_2"
description = "无意识醒来发现该部位有精液的旁白（精液量分级选文）"

[[entries]]
conditions = "selected.body_semen.嘴.1 < 10"
context = "\n{Name}感到嘴里突然有一丝异样的味道，她下意识地用舌头舔了舔唇边，尝到了一点点咸腥的滋味。\n那微量的白色液体在她的舌尖上扩散开来，带着一股浓烈的男性气息。\n她皱起眉头，试图吐出这股奇怪的味道，却发现那种味道已经渗入她的味蕾。\n她用手背擦了擦嘴角，看到上面沾着一小滴半透明的黏液，顿时明白了什么。\n她赶紧又吐了几下，想要清除口腔里残留的精液味道，却发现那股腥臊的气息似乎已经黏在她的舌头和牙齿上，怎么也吐不干净，让她既恶心又困惑。\n"

[[entries]]
conditions = "selected.body_semen.嘴.1 >= 10 && selected.body_semen.嘴.1 < 50"
context = "\n{Name}感到嘴里突然涌入一股温热的液体，咸腥的味道立刻占据了她的整个口腔。\n她惊讶地发现自己的嘴里充满了浓稠的白色精液，那些液体黏在她的牙齿上，舌头下，甚至渗入了她的喉咙。\n她本能地想要吐出，一边咳嗽一边干呕，但大部分精液已经从喉咙滑入了食道。\n她能清晰地感觉到那股液体顺着食道缓缓下滑，留下一路黏腻的触感。\n更多的精液从她的嘴角溢出，顺着下巴滴落。\n她急忙用手抹去那些外流的白浊，却无法摆脱口腔中那股挥之不去的浓烈腥味和粘稠质感。\n她尝试用唾液冲刷口腔，却只是稀释了那些精液，让它们更容易流入喉咙，最终不得不咽下更多。\n"

[[entries]]
conditions = "selected.body_semen.嘴.1 >= 50 && selected.body_semen.嘴.1 < 150"
context = "\n{Name}感到嘴里突然大量涌入一股温热的液体，刹那间她的整个口腔都被那股黏稠的白色浊液充满了。\n精液的量如此之多，瞬间就从她的嘴角、鼻孔甚至是眼角溢了出来。\n她张大嘴，却只让更多的精液如同瀑布般从她的嘴里倾泻而出，顺着她的下巴、脖子一直流到胸前，打湿了她的衣服。\n那些液体的味道极其浓烈，又咸又腥，带着一股强烈的雄性气息，直冲她的大脑。\n她不停地咳嗽、干呕，想把嘴里的精液吐出来，却仍有大量液体顺着喉咙进入了她的食道和胃部，让她的腹部感到一阵温热和沉重。\n她能清晰地感觉到那些精液在她的喉咙和食道壁上滑动的触感，黏糊糊的，怎么也吞不干净，也吐不干净，仿佛她的整个消化系统都被那股恶心的液体占据了。\n"

[[entries]]
conditions = "selected.body_semen.嘴.1 >= 150"
context = "\n{Name}猝不及防地感到一股巨量精液从喉咙深处涌上来，瞬间灌满了她的整个口腔。\n精液的量实在太多，强大的压力使得白浊液体从她的口腔，甚至是鼻腔里喷射而出，形成数股白色喷泉，把她的上半身全部淋得透湿，甚至飞溅到了她的头发和衣服上。\n她能感觉到自己的食道和胃部被大量温热的精液充满，那种沉甸甸的饱胀感让她的腹部微微隆起，仿佛怀孕一般鼓胀。\n精液的味道极度浓烈，那股浓稠的腥臭味充斥着她的每一个感官，强烈到几乎让她窒息，就像整个人被埋在了精液海洋里无法呼吸。\n她拼命干呕，却只是让更多精液从喉咙深处涌出，每次呕吐都伴随着一大股精液的喷发，在地上吐出了一小滩白浊水洼。\n"
