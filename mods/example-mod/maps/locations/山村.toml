# ═══════════════════════════════════════════════════════════════════
# maps/locations/山村.toml —— 第③层以下：地点定义（平铺 + parent）
# ═══════════════════════════════════════════════════════════════════
# 写法变体：一个文件写多个地点（[[locations]] 数组，本文件示范）或一文件一地点
# （单独 集市.toml）——两种都合法，按组织习惯选择。层级用 parent 字段表达（不限深度）：
#   parent = null（省略）→ 顶级地点；parent = 其他地点 ID → 子地点
# 字段语义：
#   type：自由字符串（region/city/room…），引擎不预设，可用于 UI 过滤
#   tags：功能标签（有 has_shop → 显示交易按钮等；写条件 location.tags.xx == true）
#   exits：出口列表（{target 必须存在, name 显示名, time_cost 移动耗时分钟}）
# ⚠️ 标记（2026-08-09）：exits 字段当前仅校验存在、运行时未启用——移动可达性走
#   maps/graph/ 的边（地图系统补齐时决定 exits 语义；本示例同时写了 exits 和 graph
#   以便两种设计就绪后都能跑）
# 移动可达性由 maps/graph/ 的边决定（见 graph 文件）。
# ═══════════════════════════════════════════════════════════════════

[[locations]]
id = "山村"
name = "山村"
type = "region"
tags = ["has_shop"]
exits = [
  { target = "集市", name = "前往集市", time_cost = 30 }
]

[[locations]]
id = "集市"
name = "集市"
parent = "山村"                 # 集市属于山村
type = "town"
# has_indoor：室内地点 tag（h-exposure 露出模式 1 判定——缺省=室外；带屋顶的棚市集算室内）
tags = ["has_shop", "has_tavern", "has_indoor"]
exits = [
  { target = "山村", name = "回到山村", time_cost = 30 }
]
