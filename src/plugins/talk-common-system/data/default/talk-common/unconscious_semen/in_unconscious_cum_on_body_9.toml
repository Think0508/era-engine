# 无意识醒来精液口上（睡奸/时停/催眠通用——settle_unconscious_semen_and_cloth 触发）
# 来源：erArk data/talk/system/second_unconscious_semen.csv（2026-08-16 转换）
# 部位编号 = 引擎 BODY_PART_CID 体系（非 erArk 编号）：0 头发 1 面 2 嘴 3 胸 5 手 6 阴道
#   7 子宫 8 肛 9 脚 10 尿道 11 腿；erArk 映射 9→10 / 10→11 / 11→9；
#   跳过 4 腋 / 12 尾巴 / 13 角（引擎无对应部位，grill 定案）
# 触发：h-npc-ai getText('in_unconscious_cum_on_body_{引擎编号}', targetId) → {Name} 替换
# ⚠️ mod 可覆盖（talk-common 合并语义：mods/{mod}/definitions/talk-common/ 同名 variable 覆盖）
# 原文为第三人称"她"视角（方舟向）——武侠 mod 如需改人称/文风，覆盖本文件即可

# ── 脚（引擎编号 9；erArk 11）──
variable = "in_unconscious_cum_on_body_9"
description = "无意识醒来发现该部位有精液的旁白（精液量分级选文）"

[[entries]]
conditions = "selected.body_semen.脚.1 < 10"
context = "\n{Name}感到脚上有一丝湿润，她低头一看，发现一小滴白色浓稠的精液停留在她的脚背上，像一颗小小的白色珍珠。\n那滴精液虽小，但在她白净的脚上格外显眼，她能感受到那种微微的黏腻触感，就像有人悄悄往她脚上涂了一点黏糊糊的胶水。\n{Name}好奇地用手指轻轻触碰那小滴精液，立刻感到一种滑溜溜的触感，手指与脚背之间拉出一条淫秽的细丝。\n她下意识地把手指凑到鼻子前闻了闻，一股淡淡的咸腥味直冲鼻腔，让她皱起了眉头。\n{Name}羞耻地环顾四周，生怕有人看到她脚上的这滴脏东西，赶紧用手帕擦拭，心里既困惑又恶心，不知道是谁这么变态，竟然会把这种东西弄到她的脚上。\n她使劲擦了几下，总算把那滴精液擦干净了，但那种被玷污的感觉却挥之不去，让她忍不住反复搓揉自己的脚背，试图彻底清除那种黏腻的触感和记忆。\n"

[[entries]]
conditions = "selected.body_semen.脚.1 >= 10 && selected.body_semen.脚.1 < 50"
context = "\n{Name}感到脚上有几处湿润，她低头一看，差点叫出声来——白色的精液随意地散布在她的脚背、脚踝甚至脚趾上。\n那些精液有的已经半干，形成了白色的小硬块，有的则还保持着湿润，在灯光下泛着淫靡的光泽。\n{Name}能清晰地看到那些白浊液体在脚趾间形成的小水洼，随着她的移动而缓缓流动，发出细微的“咕叽”声，那种黏糊糊的感觉随着脚步的移动变得更加明显。\n她厌恶地皱起眉头，强忍着恶心用手指去抹那几滴精液，结果手指立刻被沾得黏答答的，精液在她的指尖和脚趾间拉出几条恶心的白丝，那种触感让她直起鸡皮疙瘩。\n{Name}把手指凑到鼻子下闻了闻，立刻被那股浓烈的腥臭味熏得直咳嗽。\n她赶紧用纸巾擦拭手指和脚部，却发现那些精液已经渗入了脚趾的缝隙和指甲周围，怎么擦也擦不干净。\n她又羞又恼，脸颊烧得通红，一边继续擦拭，一边紧张地查看周围，害怕有人看到她这副狼狈样子。\n那种被男人体液玷污的感觉让她既愤怒又羞耻。\n"

[[entries]]
conditions = "selected.body_semen.脚.1 >= 100"
context = "\n{Name}发现自己的双脚完全浸泡在一滩粘稠的白色液体中，精液的量如此之多，她的每一步都伴随着令人作呕的“啪嗒”声。\n她的脚完全被精液浸透，从脚背到脚底，连脚踝处都被溅上了大量白浊，那些液体顺着她的脚弓流动，在地面上留下一串淫靡的脚印。\n她能感觉到精液的温热和黏腻，这些体液深入到她脚部每一条皱纹和每个趾缝中，形成了一种恶心的包裹感，仿佛穿了一双由精液织成的袜子。\n她拼命用手擦拭，却只是让那些液体在皮肤上涂抹得更开，越擦越黏，很快她的手也被沾满了精液。\n浓烈的腥膻味直冲鼻腔，让她反胃不已。\n她绝望地看着自己被玷污的双脚，那些精液粘得如此之紧，仿佛已经与她的皮肤融为一体，无论如何都无法彻底清除。\n每走一步，都有新的精液从趾缝间挤出，发出令人尴尬的水声，提醒着她那些龌龊液体的存在。\n"
