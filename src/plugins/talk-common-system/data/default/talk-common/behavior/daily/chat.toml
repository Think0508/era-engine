# chat 指令默认通用口上（插件默认层，Layer 1）
# ============================================================
# ⚠️ 骨架说明（2026-08-xx，与 stroke 对齐）
# - 本文件只保留「示例 + 占位符」骨架，等待人工手写替换；不搬运 AI 生成/重复文本。
# - 原 10 条世界观占位（龙门/罗德岛等）已移除：口上仅为叙事，不影响 chat 的 effect 数值结算。
# - 占位符格式：「聊天指令通用口上 N」（N 连续编号）。
# - 前提写法：无条件组（erArk sys_0，恒真）不写条件；高好感组使用 premise(high_1)。
# - mod 可覆盖：mods/[模组名]/definitions/talk-common/ 下同路径文件覆盖本默认层。

variable = "chat"
description = "聊天指令默认通用口上（角色通用口上 Layer 1 兜底，mod 可覆盖）"

# ── 无条件组 ──────────────────────────────────────────────
# erArk 前提：sys_0（普通状态，恒真）→ 不写条件。
# 原多条通用短句；这里保留 1 示例 + 1 占位符。
[[entries]]
context = "{player.name}与{character.name}聊了一会儿天。"

[[entries]]
context = "聊天指令通用口上 1"

# ── 高好感组 ──────────────────────────────────────────────
# erArk 前提：high_1（权重前提，恒通过、权重 1）→ 条件：premise(high_1)。
# 原 1 条加权长句；这里保留为示例 + 1 占位符。
[[entries]]
conditions = "premise(high_1)"
context = "{player.name}和{character.name}在{location.name}里聊了一会儿天，两人似乎谈得很投缘。"

[[entries]]
conditions = "premise(high_1)"
context = "聊天指令通用口上 2"