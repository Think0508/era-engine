[talents]

[talents."剑骨"]
name = "剑骨"
description = "天生适合练剑，剑法伤害+5%/级"
max = 10
tags = ["combat"]

[[talents."剑骨".modifiers]]
formula = "combat_damage"
when_tag = "sword"
multiply = 0.05

[talents."剑术精通"]
name = "剑术精通"
description = "剑术天赋"
max = 10

[talents."肛交擅长"]
name = "肛交擅长"
description = "肛交实行值+10/级"
max = 5

[[talents."肛交擅长".modifiers]]
formula = "judge"
when_type = "anal"
plus = 10

[talents."初出茅庐"]
name = "初出茅庐"
description = "自动获得"
max = 1
gain = { condition = "player.技巧 >= 10" }

[talents."窄域时停"]
name = "窄域时停"
description = "时停门槛（窄域）——测试/dev 用"
max = 1

[talents."广域时停"]
name = "广域时停"
description = "时停门槛（广域）——测试/dev 用"
max = 1

# 属性有效值层 计划二夹具：声明式来源（天赋 → attribute_mods，per_level 按天赋等级缩放）
# 新增而非改既有天赋：既有条目被 roster.toml/npc.toml 与其他测试引用。
# 无生产消费方读取它（测试用：src/core/mod-loader.test.ts）。
[talents."修正测试天赋"]
name = "修正测试天赋"
description = "属性修正夹具（1 级 +20，每多 1 级再 +5）"
max = 5
attribute_mods = [ { attr = "修正测试值", flat = 20, per_level = 5 } ]
