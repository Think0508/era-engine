<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>era-engine</title>
  </head>
  <body>
    <!-- 引擎启动加载占位（2026-08-10 方案 B）：
         main.ts 在引擎初始化完成后才 mount Vue，此前的加载期由本占位填充。
         ① 默认 = 下方闪烁"加载中…"文字（fallback，永不报错）；
         ② mod 可在 meta.toml 声明 loading_video/loading_image（相对 mod 根的路径，
            素材放 mods/{mod}/assets/）——main.ts loadMod 后把素材插进 #loading-screen；
         ③ Vue mount 会替换 #app 内容 → 占位随引擎就绪自动消失。 -->
    <div id="app">
      <div id="loading-screen">
        <div class="loading-text">加载中<span class="loading-dots">…</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <style>
      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a1a2e;
        z-index: 9999;
        /* 未来扩展：background-image / <video> 头图占位 */
      }
      .loading-text {
        color: #e0e0e0;
        font-size: 20px;
        font-family: system-ui, -apple-system, sans-serif;
        letter-spacing: 0.4em;
        animation: loading-blink 1.2s ease-in-out infinite;
      }
      .loading-dots {
        display: inline-block;
        width: 1.2em;
        overflow: hidden;
        vertical-align: bottom;
        animation: loading-dots 1.2s steps(4, end) infinite;
      }
      @keyframes loading-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes loading-dots {
        0% { width: 0; }
        100% { width: 1.2em; }
      }
    </style>
  </body>
</html>
