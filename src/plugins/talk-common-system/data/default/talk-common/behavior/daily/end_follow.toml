# end_follow 指令默认通用口上（插件默认层，Layer 1）
# ============================================================
# ⚠️ 骨架说明（2026-08-25）
# - erArk data/talk/daily/end_follow.csv 原 10 条全部为 sys_0 通用短句，不照搬；
#   本文件保留「示例 + 占位符」骨架，等待人工手写替换。
# - 占位符格式：「结束同行指令通用口上 N」（N 连续编号）。
# - 口上仅为叙事，不影响 end_follow 的 set_follow 数值。
# - 世界观内容（博士/罗德岛/源石等）不保留。
# - mod 可覆盖：mods/[模组名]/definitions/talk-common/ 下同路径文件覆盖本默认层。

variable = "end_follow"
description = "结束同行指令默认通用口上（角色通用口上 Layer 1 兜底，mod 可覆盖）"

# ── 无条件组 ──────────────────────────────────────────────
# erArk 前提：sys_0（普通状态，恒真）→ 不写条件。
# 原 10 条为“结束同行/道别”的短句；保留 1 条示例 + 1 条占位符。
[[entries]]
context = "{character.name}停下脚步，和{player.name}道别，恢复了自由行动。"

[[entries]]
context = "结束同行指令通用口上 1"