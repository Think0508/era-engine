# ═══ 契约补键（2026-08-09）═══
# 隐蔽：erArk ability 90（性技类），h-hidden 隐奸/露出相关系数读取；
#   与 abilities.toml "隐蔽" 条目配套（attribute 注册条件字典 + 落 abilities 命名空间）
"隐蔽" = { type = "number", default = 0, category = "ability", display = true, display_group = "性能力" }

# ════════════════════════════════════════
# 契约补全（2026-08-09 审查修复）：erArk 标准角色卡（ABL/刻印/感度/扩张/性技）
# 此前只存在于 test-mod attributes.toml —— 武侠等新 mod 无 attributes.toml 时，
# ① 最小必需集校验器（h-core）对每个角色警告缺 marks/abilities
# ② 条件字典不注册 player.技巧 / player.快乐刻印 等路径（指令条件校验失败）
# ③ 属性面板不显示刻印/能力分组
# 现在随 h-core 默认层提供（erArk-standard 角色卡），mod 可覆盖；
# 与 abilities.toml 条目配套（attribute 注册条件字典 + 落 abilities 命名空间）
# ════════════════════════════════════════

