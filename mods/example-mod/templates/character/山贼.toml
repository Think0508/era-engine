# ═══════════════════════════════════════════════════════════════════
# templates/character/山贼.toml —— 第③层：模板的差分（继承示例）
# ═══════════════════════════════════════════════════════════════════
# extends = "base-human" → 本模板 = base-human + 下面这些差异：
#   - 写了 attack/体力 → 覆盖 base-human 的值
#   - 没写 hp/mp/defense/speed/精力 → 自动继承 base-human 的
# 这就是「在它之上只写差分」—— 一个具体角色的模板链：
#   base-human（公共卡）→ 山贼（差分）→ roster 里的每个山贼（再差分）
# ═══════════════════════════════════════════════════════════════════

id = "山贼"
name = "山贼"
extends = "base-human"

base = { attack = 15, "体力" = 150, "气力" = 80 }

# 差分还可以加父模板没有的字段（新增不受限制）：
talents = { "天生神力" = 1 }
