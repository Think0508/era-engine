[meta]
id = "combat-base"
name = "回合制战斗骨架"
version = "1.0.0"
description = "战斗本地管线：回合循环/相位结算/效果区/反击递归防护/隔离回写"

[data_dependencies]
provides = ["combat:ready"]
depends_on = ["status:ready", "abilities:ready", "effects:ready"]

# 战斗必需属性（合同 v1.0：hp/mp 隔离值；speed 不再使用——先攻由子插件 initiative 钩子决定）
[required_attributes]
hp = { type = "number", description = "生命值，战斗内隔离扣减，结束回写" }
mp = { type = "number", description = "内力/能量值，技能消耗" }

# 可选：上限（治疗/吸收钳制；未绑定则用当前值入场）
[optional_attributes]
hp_max = { type = "number", description = "生命值上限（吸内/治疗钳制用）" }
mp_max = { type = "number", description = "内力上限（吸上限/永久吸收回写用）" }

[condition_fields]
"combat.turn_count" = { type = "number", description = "当前战斗回合数" }

[[events.listen]]
name = "combat:request"
description = "响应战斗请求"