# 无意识醒来精液口上（睡奸/时停/催眠通用——settle_unconscious_semen_and_cloth 触发）
# 来源：erArk data/talk/system/second_unconscious_semen.csv（2026-08-16 转换）
# 部位编号 = 引擎 BODY_PART_CID 体系（非 erArk 编号）：0 头发 1 面 2 嘴 3 胸 5 手 6 阴道
#   7 子宫 8 肛 9 脚 10 尿道 11 腿；erArk 映射 9→10 / 10→11 / 11→9；
#   跳过 4 腋 / 12 尾巴 / 13 角（引擎无对应部位，grill 定案）
# 触发：h-npc-ai getText('in_unconscious_cum_on_body_{引擎编号}', targetId) → {Name} 替换
# ⚠️ mod 可覆盖（talk-common 合并语义：mods/{mod}/definitions/talk-common/ 同名 variable 覆盖）
# 原文为第三人称"她"视角（方舟向）——武侠 mod 如需改人称/文风，覆盖本文件即可

# ── 面（引擎编号 1；erArk 1）──
variable = "in_unconscious_cum_on_body_1"
description = "无意识醒来发现该部位有精液的旁白（精液量分级选文）"

[[entries]]
conditions = "selected.body_semen.面.1 < 10"
context = "\n{Name}感到脸上有一丝湿润，她下意识地用手轻轻一擦，指尖沾上了一小滴白色液体。\n她把指尖凑近鼻子，一股淡淡的腥膻味扑面而来，让她皱起了眉头。\n她困惑地望着指尖上那略显粘稠的精液，放在阳光下观察，能看见那小液滴在光线照射下呈现半透明状。\n她用手指抹了抹脸颊，试图找出更多液体，却只发现那里微微有些黏腻，像是大部分已经干涸了。\n她又擦了几下，确保脸上没有任何痕迹，却仍然感到一种莫名的不安和困惑，不知道这种液体为何会出现在她脸上。\n"

[[entries]]
conditions = "selected.body_semen.面.1 >= 10 && selected.body_semen.面.1 < 50"
context = "\n{Name}感到脸颊上有几处明显的湿润感，她用手一擦，惊讶地发现手指上沾满了白色的粘稠液体。\n那些精液像奶油一样附着在她的脸颊、下巴和额头上，有些甚至黏住了她的睫毛，让她眨眼都变得困难。\n她急忙掏出镜子查看，只见脸上分布着好几滩白浊，有些已经半干，形成了一层薄薄的膜。\n她能闻到那股浓重的腥臊味，尝试用手帕擦拭，却发现那些黏糊糊的液体越擦越开，反而弄得满脸都是。\n她恼火地继续擦拭，心里翻腾着疑惑和羞耻，不明白这些恶心的东西怎么会出现在她的脸上。\n"

[[entries]]
conditions = "selected.body_semen.面.1 >= 50"
context = "\n{Name}感到一阵温热的液体大量喷溅在她的脸上，她下意识地用手擦拭，结果整个手掌都沾满了黏糊糊的白色浊液。\n她发现自己的脸被彻底覆盖了，大量精液像面膜一样贴在她的每一寸肌肤上，从额头、眉毛、鼻梁到下巴，无一幸免。\n有几股浓稠的精液甚至挂在她的睫毛上，遮挡了她的视线，让她不得不反复眨眼。\n更多的精液顺着她的脸颊缓缓流下，滴落到她的脖子和锁骨上，弄脏了她的衣领。\n那强烈的腥味直冲鼻腔，让她几乎作呕。\n她不停地用手和衣袖擦拭，却只是把那些黏腻的浊液涂抹得到处都是。\n每次擦完一处，另一处就有新的精液流下来，让她陷入了一种绝望的循环，仿佛永远也清理不干净自己。\n"
