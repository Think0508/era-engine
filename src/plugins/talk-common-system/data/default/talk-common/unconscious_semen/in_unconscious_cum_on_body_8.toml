# 无意识醒来精液口上（睡奸/时停/催眠通用——settle_unconscious_semen_and_cloth 触发）
# 来源：erArk data/talk/system/second_unconscious_semen.csv（2026-08-16 转换）
# 部位编号 = 引擎 BODY_PART_CID 体系（非 erArk 编号）：0 头发 1 面 2 嘴 3 胸 5 手 6 阴道
#   7 子宫 8 肛 9 脚 10 尿道 11 腿；erArk 映射 9→10 / 10→11 / 11→9；
#   跳过 4 腋 / 12 尾巴 / 13 角（引擎无对应部位，grill 定案）
# 触发：h-npc-ai getText('in_unconscious_cum_on_body_{引擎编号}', targetId) → {Name} 替换
# ⚠️ mod 可覆盖（talk-common 合并语义：mods/{mod}/definitions/talk-common/ 同名 variable 覆盖）
# 原文为第三人称"她"视角（方舟向）——武侠 mod 如需改人称/文风，覆盖本文件即可

# ── 肛（引擎编号 8；erArk 8）──
variable = "in_unconscious_cum_on_body_8"
description = "无意识醒来发现该部位有精液的旁白（精液量分级选文）"

[[entries]]
conditions = "selected.body_semen.肛.1 < 10"
context = "\n{Name}感到后穴处有一丝微妙的湿润感，仿佛有什么细小的液滴在那里。\n她下意识地收紧肛门，却感到一小滴液体从肛门口渗出。\n她小心翼翼地用手指探向后方，触碰到一点湿滑的液体。\n她将手指拿到眼前查看，发现指尖沾上了一小滴白色的黏稠物质，不用猜也知道那是什么。\n她能感觉到那微量的精液附着在肛门周围的褶皱上，带来一种难以言喻的黏腻感。\n每当她移动身体或收缩肌肉，都会感觉到那一小滴液体在肛门口周围缓缓流动，提醒着她那里被玷污的事实。\n她匆忙擦拭后穴，试图清除那些液体和随之而来的微妙气味，却感觉那些精液似乎已经渗入了肛门周围的皱褶中，怎么也擦不干净。\n"

[[entries]]
conditions = "selected.body_semen.肛.1 >= 10 && selected.body_semen.肛.1 < 100"
context = "\n{Name}感到后穴处传来明显的湿润感，一股温热的液体从肠道深处缓缓流向肛门。\n她惊慌地收紧肌肉，却只是促使更多的液体从肛门口溢出。\n她能清晰地感觉到那些精液沿着肠壁缓缓下滑，带来一种奇怪的滑腻感，每动一下都能感受到肠道内精液的流动。\n当她实在忍不住放松肌肉时，一股白浊立刻从肛门涌出，顺着臀缝流下，沾湿了她的内裤。\n那种被后穴灌满的感觉既陌生又羞耻，她能感受到那些精液的温度和黏稠度，甚至能闻到从后方散发出的那股浓烈腥臊味。\n她急忙用纸巾擦拭后穴和臀缝，却发现那些白浊液体源源不断地从体内涌出，无论她怎么擦，总有新的液体流出来，就像她的肠道里储存了一大滩精液一样，永远也清理不干净。\n"

[[entries]]
conditions = "selected.body_semen.肛.1 >= 100 && selected.body_semen.肛.1 < 500"
context = "\n{Name}感到后穴处一阵突如其来的强烈压力，随即一股温热的液体从肠道深处猛烈地涌向出口。\n她发现自己几乎无法控制肛门肌肉，精液如同小溪一般从她的后穴流出，顺着臀缝滑下，在她的大腿上留下蜿蜒的白色痕迹。\n她能清晰地感受到那些精液从肠道深处涌出的感觉，像一波接一波的液体浪潮冲刷着她的直肠内壁，带来一种既羞耻又奇怪的刺激感。\n她的整个肛门周围都被那些粘稠的白色液体浸湿，精液甚至渗入到了臀缝的每一处褶皱中，让她感到一种难以言喻的黏腻不适。\n那种排泄般却又不同的感觉让她面红耳赤，几乎不敢移动身体，生怕更多的液体会涌出来。\n她慌张地用大量纸巾擦拭后穴和臀部，却发现精液的流动完全不受控制，无论她如何擦拭，总会有新的液体从肠道深处涌出，让她陷入一种无休止的清理循环。\n每次她以为终于清理干净了，只要稍微活动身体或改变姿势，就会有新一波温热的精液从后穴溢出，提醒着她体内深处还有更多液体在等待着被排出。\n"

[[entries]]
conditions = "selected.body_semen.肛.1 >= 500 && selected.body_semen.肛.1 < 1000"
context = "\n{Name}感到后穴处一阵突如其来的强烈压力，随即大量温热的液体从肠道深处喷涌而出。\n她发现自己再也无法控制肛门肌肉，大量浓稠的白色精液如同决堤的洪水般从她的后穴喷射而出，顺着臀缝和大腿流淌，甚至滴落到地面上，形成了一小滩白色水洼。\n她能清晰地感受到那些精液从肠道深处冲刷而下的感觉，就像一场温热的液体风暴在她的肠道内肆虐。\n她的整个后穴和臀缝都被那些白浊淹没，精液甚至流到了会阴和大腿后侧，形成了蜿蜒的白色痕迹。\n那种排泄般的感觉和巨大的羞耻感让她双腿发抖，几乎站立不稳。\n她慌乱地抓起大把纸巾，疯狂地擦拭后穴和臀部，却发现精液还在不断地从深处涌出，就像永远也排不干净一样。\n她不得不双手捂住后穴，试图阻止那羞耻的液体流出，却只能感受到液体从指缝间溢出的无奈。\n"

[[entries]]
conditions = "selected.body_semen.肛.1 >= 1000 && selected.body_semen.肛.1 < 2000"
context = "\n{Name}突然感到后穴一阵剧烈的膨胀感和压力，随即一股精液洪流从她的肠道深处猛烈地喷射而出。\n她感受到自己的肛门完全失去了控制，大量乳白色的精液如同打开的水龙头一般从她的后穴涌出，顺着她的臀缝、大腿甚至小腿一路流淌，在地面上形成了一个迅速扩大的白色水洼。\n她的肠道内传来一种被灌满然后排空的强烈感受，那些精液在离开体内时带来一种难以形容的排泄快感和极度羞耻。\n她的整个下半身都被那些精液弄得湿漉漉的，白色的黏稠液体覆盖了她的臀部、会阴、大腿甚至膝盖，皮肤上到处都是精液流淌的痕迹。\n那种被后穴强奸并灌满的感觉如此强烈，让她的双腿不断颤抖，呼吸急促，脸上写满了羞耻和恐惧。\n她试图用尽全身力气收紧肛门，却只是让更多的精液以更大的压力喷射而出，每一次喷射都伴随着肠道内部的一阵痉挛和空虚感。\n她绝望地抓起所有能找到的纸巾用力按压着堵在自己的后穴上，试图堵住不断流出的精液河流，却发现那些液体的量实在太大，无论她如何擦拭，总有更多的精液从肠道深处涌出，让她陷入一种无望的清理循环。\n"

[[entries]]
conditions = "selected.body_semen.肛.1 >= 2000"
context = "\n{Name}突然感到肠道内一阵剧烈的胀痛和难以承受的压力，接着她感到自己的整个后穴像被撕裂一样，一股巨大的精液喷泉从她的肛门爆发而出。\n她看着白浊色的液体以惊人的压力从她的后穴喷射出来，在地面上形成了一个迅速扩散的精液池塘。\n随着她的每一次痛苦的抽搐，都有新一波精液从她的后穴喷涌而出，就像一个无法关闭的喷泉。\n她的整个下半身已经完全被精液浸透，从腰部到脚踝都被厚厚的白色液体覆盖，黏腻的触感和令人作呕的腥臊味无处不在。\n那种肠道被彻底侵犯和占据然后强制排空的感觉如此强烈，让她感到既恶心又羞耻，身体却因为巨量液体的排出而感到一种变态的解脱感。\n她拼命地试图控制住自己的括约肌，但那些肌肉似乎已经完全罢工，任由精液不受控制地喷射而出，每一次喷发都伴随着肠道内的一阵痉挛和空虚感。\n她无助地跪倒在自己制造的精液池塘中，双手捂住不断喷射的后穴，却只是让精液从指缝间喷出，溅得满手都是，那种被玩弄和侮辱的感觉让她泪流满面，却无法阻止身体的本能反应继续排出那些污秽的液体。\n"
