# 无意识醒来精液口上（睡奸/时停/催眠通用——settle_unconscious_semen_and_cloth 触发）
# 来源：erArk data/talk/system/second_unconscious_semen.csv（2026-08-16 转换）
# 部位编号 = 引擎 BODY_PART_CID 体系（非 erArk 编号）：0 头发 1 面 2 嘴 3 胸 5 手 6 阴道
#   7 子宫 8 肛 9 脚 10 尿道 11 腿；erArk 映射 9→10 / 10→11 / 11→9；
#   跳过 4 腋 / 12 尾巴 / 13 角（引擎无对应部位，grill 定案）
# 触发：h-npc-ai getText('in_unconscious_cum_on_body_{引擎编号}', targetId) → {Name} 替换
# ⚠️ mod 可覆盖（talk-common 合并语义：mods/{mod}/definitions/talk-common/ 同名 variable 覆盖）
# 原文为第三人称"她"视角（方舟向）——武侠 mod 如需改人称/文风，覆盖本文件即可

# ── 手（引擎编号 5；erArk 5）──
variable = "in_unconscious_cum_on_body_5"
description = "无意识醒来发现该部位有精液的旁白（精液量分级选文）"

[[entries]]
conditions = "selected.body_semen.手.1 < 10"
context = "\n{Name}感到手上有一丝微妙的湿润感，低头一看，发现手指上沾着一小滴白色液体。\n这滴半透明的浊白色液体在指尖上泛着微弱的珍珠光泽，细小却清晰可见。\n她轻轻用另一只手的指腹触碰，感受到了一种独特的黏腻触感，微暖且略带滑腻。\n液体带着一丝几乎难以察觉的淡淡腥味，当她尝试将手指并拢又分开时，竟能拉出一条细微的丝线，显示出其特有的粘性。\n她困惑地皱起眉头，仔细观察这滴不明液体，思考它从何而来，为何会出现在她的手上。\n她试图用拇指擦拭，却发现液体只是在皮肤上扩散开来，变得更加薄而分散，留下一片微微发亮的痕迹。\n那种若有若无的存在感让她心中涌起一丝不安，下意识地环顾四周，寻找可能的解释，却一无所获，只能用纸巾反复擦拭，试图抹去那种异样的黏腻感和随之而来的疑惑。\n"

[[entries]]
conditions = "selected.body_semen.手.1 >= 10 && selected.body_semen.手.1 < 50"
context = "\n{Name}感到手掌上有几处湿润，低头看见掌心和指缝间分布着几团白色的粘稠液体。\n这些半透明的乳白色物质在灯光下泛着微弱的光泽，质地如同未完全凝固的胶水，带着明显的咸腥气味。\n当她尝试活动手指时，这些液体像蜘蛛丝一样拉出细长的丝线，展示出其独特的粘性。\n那些液体略带温热，却又比体温稍低，在皮肤上留下一种奇特的触感。\n她试图甩掉或用纸巾擦拭，却发现这些液体顽固地粘附在皮肤的每一道纹路中，尤其在指缝和掌纹深处，怎么也擦不干净。\n她皱起眉头，心中涌起一阵强烈的厌恶和困惑，忍不住思考这些可疑液体的来源，以及它们是如何出现在她的手上的。\n每一次尝试清理，都只是让那些液体在手掌上扩散得更广，虽然能勉强擦去大部分，但那种黏腻的触感似乎仍残留在她的记忆中。\n"

[[entries]]
conditions = "selected.body_semen.手.1 >= 50"
context = "\n{Name}感到手掌上沾满了大量温热的液体，她困惑地看着手上的白浊，不明白它是从哪里来的。\n这些粘稠的乳白色液体几乎完全覆盖了她的手掌和每根手指，形成一层厚重的黏滑覆盖物。\n液体温热而稠密，散发着浓郁的咸腥气味，在灯光下呈现出半透明的珍珠光泽。\n每次她尝试活动手指，都会看到白色液体在指缝间拉出长长的丝线，像融化的芝士一样具有惊人的黏性和延展性。\n有些液体已经开始凝固，在手掌纹路中形成了白色的细小沟壑，而更多的则仍然湿漉漉地积聚在掌心，甚至有液体顺着手腕滴落到地上，留下一道道白色的痕迹。\n她试图用另一只手擦拭，却只是把液体涂抹得更广，两只手都被这些可疑的白浊液体污染。\n她的脸上写满了厌恶和困惑，急切地想要找到水源清洗，却担心这些液体会在公共场所被人发现，内心涌起一阵强烈的羞耻感。\n"
