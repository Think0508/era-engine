# 无意识醒来精液口上（睡奸/时停/催眠通用——settle_unconscious_semen_and_cloth 触发）
# 来源：erArk data/talk/system/second_unconscious_semen.csv（2026-08-16 转换）
# 部位编号 = 引擎 BODY_PART_CID 体系（非 erArk 编号）：0 头发 1 面 2 嘴 3 胸 5 手 6 阴道
#   7 子宫 8 肛 9 脚 10 尿道 11 腿；erArk 映射 9→10 / 10→11 / 11→9；
#   跳过 4 腋 / 12 尾巴 / 13 角（引擎无对应部位，grill 定案）
# 触发：h-npc-ai getText('in_unconscious_cum_on_body_{引擎编号}', targetId) → {Name} 替换
# ⚠️ mod 可覆盖（talk-common 合并语义：mods/{mod}/definitions/talk-common/ 同名 variable 覆盖）
# 原文为第三人称"她"视角（方舟向）——武侠 mod 如需改人称/文风，覆盖本文件即可

# ── 胸（引擎编号 3；erArk 3）──
variable = "in_unconscious_cum_on_body_3"
description = "无意识醒来发现该部位有精液的旁白（精液量分级选文）"

[[entries]]
conditions = "selected.body_semen.胸.1 < 10"
context = "\n{Name}感到胸前有一丝湿润，低头看见胸部上有几滴小小的白色液体，在她光滑的肌肤上形成了醒目的对比。\n那些精液小滴像露珠一样附着在她的乳房上，有几滴甚至沿着乳沟滑落，留下一道细小的痕迹。\n她用食指轻轻擦拭，感受到那微妙的黏腻感，指尖和肌肤之间形成了一条细细的白丝。\n她拿起一张纸巾，小心地将那些液体拭去，却发现有几滴已经渗入了衣物，留下一个微小的湿痕。\n她皱起眉头，嗅了嗅沾有精液的手指，那淡淡的腥味让她心生厌恶，连忙又擦了几下，确保胸前的每一滴液体都被清理干净。\n"

[[entries]]
conditions = "selected.body_semen.胸.1 >= 10 && selected.body_semen.胸.1 < 50"
context = "\n{Name}感到胸部前方湿漉漉的一片，低头一看，差点惊叫出声。\n她光滑的乳房上布满了白色的精液，那些黏稠的液体像蜂蜜一样缓缓流淌，沿着她的乳沟和乳房的曲线蔓延。\n有些精液落在她的乳头上，把那敏感的部位包裹得油光发亮。\n她急忙用手去擦，却只是把那些液体涂抹得更开，弄得整个胸部都黏糊糊的。\n那股刺鼻的腥味不断钻入她的鼻腔，让她忍不住皱眉。\n她抓起几张纸巾，拼命地擦拭，却发现那些浊液已经渗入了她的内衣和衣物，形成了难以去除的湿痕。\n那种被玷污的感觉让她既恼火又羞耻，不停地擦拭胸部和乳沟，想要消除所有痕迹。\n"

[[entries]]
conditions = "selected.body_semen.胸.1 >= 50 && selected.body_semen.胸.1 < 200"
context = "\n{Name}感到胸部被一股温热的液体大量覆盖，低头看去，差点吓得尖叫起来。\n她的整个胸部已经完全被浓稠的白色精液淹没，就像被浇了一桶白色颜料一样。\n那些黏糊糊的液体把她的乳房完全包裹，从乳头到乳晕，再到整个胸部，无一幸免。\n大量精液顺着她的乳沟流入，在那里形成了一个小小的白色池塘，随着她的呼吸轻轻晃动。\n更多的精液沿着她的腹部向下流淌，有些甚至渗入了她的肚脐，留下一股难以言喻的黏腻感。\n那种被浸透的感觉让她浑身发抖，精液的腥臭味如此浓烈，仿佛整个空间都被这股气味填满。\n她慌乱地抓起衣物和纸巾，疯狂地擦拭，却只能勉强清理表面的一层，更多的精液已经渗入了她的皮肤纹理和衣物纤维中，怎么也擦不干净。\n"

[[entries]]
conditions = "selected.body_semen.胸.1 >= 200"
context = "\n{Name}发现自己的胸部被大量精液完全淹没，这些污秽的液体几乎把她整个上半身都覆盖了。\n她的双乳浸泡在白色的浊液中，乳头和乳晕被厚厚一层精液包裹，看起来好像穿了一件由精液制成的胸罩。\n乳沟里积累了惊人数量的精液，形成了一个小型的白色湖泊，随着她每次呼吸或移动，那些液体就会溢出来，顺着她的肋骨和腹部流淌。\n精液的量如此之多，以至于开始从她的胸部滴落，在地上形成了一滩小水洼。\n那股强烈的男性气味几乎让她窒息，精液的腥臭味充斥着她的鼻腔，使她感到一阵恶心和头晕。\n她能感觉到精液的热度透过皮肤传导，使她的胸部变得温热而黏腻，就像被一层厚厚的、恶心的乳霜覆盖。\n她绝望地用手去抓紧能拿到的任何东西——毛巾、衣物、纸巾，疯狂地擦拭自己的胸部，但那些精液实在太多了，仿佛永远也擦不干净。\n每擦去一层，下面还有更多，而且那些液体已经开始变得粘稠，在她的皮肤上形成一层薄膜，让擦拭变得更加困难。\n她的衣服已经被精液完全打湿，紧贴在身上，勾勒出她丰满乳房的轮廓，仿佛在宣告她被彻底玷污的事实。\n"
