# 无意识醒来精液口上（睡奸/时停/催眠通用——settle_unconscious_semen_and_cloth 触发）
# 来源：erArk data/talk/system/second_unconscious_semen.csv（2026-08-16 转换）
# 部位编号 = 引擎 BODY_PART_CID 体系（非 erArk 编号）：0 头发 1 面 2 嘴 3 胸 5 手 6 阴道
#   7 子宫 8 肛 9 脚 10 尿道 11 腿；erArk 映射 9→10 / 10→11 / 11→9；
#   跳过 4 腋 / 12 尾巴 / 13 角（引擎无对应部位，grill 定案）
# 触发：h-npc-ai getText('in_unconscious_cum_on_body_{引擎编号}', targetId) → {Name} 替换
# ⚠️ mod 可覆盖（talk-common 合并语义：mods/{mod}/definitions/talk-common/ 同名 variable 覆盖）
# 原文为第三人称"她"视角（方舟向）——武侠 mod 如需改人称/文风，覆盖本文件即可

# ── 腿（引擎编号 11；erArk 10）──
variable = "in_unconscious_cum_on_body_11"
description = "无意识醒来发现该部位有精液的旁白（精液量分级选文）"

[[entries]]
conditions = "selected.body_semen.腿.1 < 10"
context = "\n{Name}感到腿部有一丝湿润感，低头一看，发现从大腿根部到脚踝处都有几处细小的湿痕。\n她伸手轻触，手指立刻沾上了略带粘性的白色液体。\n那些精液小滴分布在她的大腿内侧、膝盖后窝和小腿肚上，每一滴在灯光下都泛着微弱的光泽。\n她用指尖轻轻揉搓那液体，发现它比水更加黏稠，拉出短短的丝线后才断开。\n她皱着眉头，小心地嗅了嗅指尖，立刻闻到一股淡淡的腥味，让她心里一沉，明白了这是什么。\n她迅速抽出纸巾，从大腿开始一路向下，仔细擦拭每一处可疑的痕迹，尤其注意膝盖后方的褶皱处和脚踝处凹陷的部分。\n即使擦拭干净后，她仍感到皮肤上似乎留下了一种若有若无的黏腻感，让她忍不住不停地搓揉腿部，试图摆脱那种被污染的感觉。\n"

[[entries]]
conditions = "selected.body_semen.腿.1 >= 10 && selected.body_semen.腿.1 < 50"
context = "\n{Name}感到整个腿部都被一股液体覆盖，低头一看，顿时呼吸一滞。\n她的腿部从腹股沟到脚踝都布满了斑驳的白色液体，那些精液在大腿内侧形成了几条明显的流痕，在膝盖周围积聚成小小的液滴，又沿着小腿一路蜿蜒而下。\n当她移动双腿时，能清晰地感受到那些黏稠的液体在腿部皮肤上滑动，尤其是大腿内侧和膝盖后窝处，那种湿滑的触感让她无比不适。\n那股刺鼻的腥臊味随着她的每一步动作不断散发出来，仿佛整个下半身都浸泡在男性气息中。\n她慌忙抓起大量纸巾，从上到下擦拭，却发现那些精液已经渗入了膝盖和脚踝处的各种褶皱中，尤其是膝盖后侧和脚踝内侧的凹陷处，怎么也擦不干净。\n她不得不反复用力擦拭，皮肤都被擦得发红，却仍然感到一种无法消除的黏腻感，就像整个腿部都被一层精液薄膜包裹着。\n"

[[entries]]
conditions = "selected.body_semen.腿.1 >= 50"
context = "\n{Name}感到整个腿部都湿透了，好像刚刚站在一场精液瀑布下洗了个澡。\n她惊骇地低头查看，只见从大腿根部一直到脚踝，整条腿都被厚厚的白色浊液完全覆盖，那些精液顺着腿部的每一条曲线流淌，在大腿内侧形成了宽大的白色河流，在膝盖处积聚成小小的精液湖泊，又沿着小腿蜿蜒而下，最后在脚踝处汇聚，滴落到地面上，形成了一个个白色的小水洼。\n当她尝试迈步时，腿部肌肉的每一次收缩都让大量精液从肌肤的褶皱中被挤出，发出令人不适的黏腻声响，而膝盖弯曲则导致更多的精液从膝窝处喷涌而出，顺着小腿后侧流下。\n那股浓烈的腥臭味几乎让她头晕目眩，仿佛站在一个精液的泥潭中。\n她慌乱地抓起所有能找到的纸巾，从上到下疯狂地擦拭，却发现那些精液的量实在太大，远超纸巾能处理的范围。\n无论她如何擦拭，总有更多的精液从大腿内侧和臀部下方涌出，仿佛有一个无底的精液源泉隐藏在她的体内。\n每一步移动都会带出新的精液流，让地面上形成一条醒目的白色足迹，宣告着她被彻底玷污的事实。\n"
