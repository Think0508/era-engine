# mods/test-mod/definitions/status-effects.toml
# 注释：状态效果定义（中文 key 需引号）

[status-effects."中毒"]
name = "中毒"
description = "持续受到毒素伤害"
category = "debuff"
duration = 360
tick_interval = 60
stackable = false
max_stack = 1
tick_effects = [
  { type = "modify_attribute", params = { attr = "hp", value = -5, target = "self" } }
]

[status-effects."醉意"]
name = "醉意"
description = "喝醉了，对话好感度加成"
category = "buff"
duration = 120
tick_interval = 0
stackable = true
max_stack = 3

# 计划三迁移（第一验收点）：原先用 on_apply_effects/on_remove_effects 改 attack **基础值**
# （modify_attribute 写 base → readRawAttr 永不回落 = 临时 buff 永久沉淀成角色属性）。
# 改为 attribute_mods（运行时清单）：生效期间有效值 +10，到期/移除自动消失，基础值分毫不动。
# ⚠️ on_apply_effects / on_remove_effects 里的 modify_attribute 默认报加载期 error
# （写基础值 = 临时加成永久沉淀）；确实要一次性永久改变（伤害/成长）时在 params 上写
# permanent = true 显式声明意图。见 core/mod-validate.ts 的状态钩子校验与 status-system 文件头注释。
[status-effects."攻击增益"]
name = "攻击增益"
description = "攻击力提升"
category = "buff"
duration = 180
tick_interval = 0
stackable = false
max_stack = 1
attribute_mods = [ { attr = "attack", flat = 10 } ]

# 属性有效值层 计划三夹具：状态生效期间对属性的临时修正（运行时来源）
[status-effects."修正测试状态"]
name = "修正测试状态"
description = "属性修正夹具（生效期间 修正测试值 +25；无 tick）"
category = "buff"
duration = 120
tick_interval = 0
stackable = false
max_stack = 1
attribute_mods = [ { attr = "修正测试值", flat = 25 } ]

# 层数修正夹具：给「修正测试层数」状态 −1 层（三层模型）
[status-effects."修正测试护体"]
name = "修正测试护体"
description = "层数修正夹具（对 修正测试层数 恒 −1）"
category = "buff"
duration = 120
tick_interval = 0
stackable = false
max_stack = 1
stack_mods = [ { status = "修正测试层数", value = -1 } ]

# 层数状态的载体：基础层数由 apply_status 的 stack/stack_add 决定
[status-effects."修正测试层数"]
name = "修正测试层数"
description = "层数夹具（基础层数由招式给定；每 60 分钟 −1 层）"
category = "debuff"
duration = 600
tick_interval = 0
stackable = false
max_stack = 10
stack_decay = { every = 60, amount = 1 }
