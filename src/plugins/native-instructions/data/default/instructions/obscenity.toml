  # 52 TARGET_ADD_SMALL_RESPECT：恭顺 +（time+30）
  { type = "settle_state", params = { state = "恭顺", baseValue = 30 } },
  # 53 TARGET_ADD_SMALL_FRIENDLY：好意 +（time+30）
  { type = "settle_state", params = { state = "好意", baseValue = 30 } },
