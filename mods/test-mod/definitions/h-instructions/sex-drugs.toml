# sex-drugs.toml——SEX药品指令
# 效果链精确复刻 erArk InstructConfig + Behavior_Effect

[[instructions]]
id = "birth_control_pills"
label = "避孕药"
type = "sex"
sub_type = "drug"
time_cost = 5
priority = 50
premises = ["HAVE_TARGET", "T_NPC_NOT_ACTIVE_H", "TARGET_IS_H", "HAVE_BIRTH_CONTROL_PILLS"]
# erArk: 无Behavior_Effect条目（纯道具消耗）
effects = [
  { type = "set_flag", params = { flag = "birth_control_pills_used", target = true } },
]

