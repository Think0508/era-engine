# src/plugins/h-time-stop/data/default/instructions/time-stop.toml
# 迁移自 erArk InstructConfig.csv（time_stop 组，5 条）
# 迁移工具输出归档：docs/instruction-replication/archive/_erark_source/definitions/h-instructions/arts.toml
# 注意：carry_target 原 premises 含 PL_NOT_BAGGING_CHARA（携袋语义，本插件不依赖）——已移除

[[instructions]]
id = "time_stop_on"
label = "时间停止流动"
type = "arts"
sub_type = "ARTS"
sub_category = "time_stop"
time_cost = 1
priority = 50
premises = ["PRIMARY_TIME_STOP", "TIME_STOP_OFF", "SANITY_POINT_G_0", "TIRED_LE_84"]
effects = [
  { type = "time_stop_on" },
  { type = "trigger_dialogue", params = { scene = "time_stop_on" } },
]

[[instructions]]
id = "time_stop_off"
label = "时间重新流动"
type = "arts"
sub_type = "ARTS"
sub_category = "time_stop"
time_cost = 1
priority = 50
premises = ["PRIMARY_TIME_STOP", "NOT_H", "TIME_STOP_ON", "TIRED_LE_84"]
effects = [
  { type = "time_stop_carry_stop" },
  { type = "time_stop_free_stop" },
  { type = "time_stop_off" },
  { type = "set_field", params = { path = "h_state.time_stop_release", value = true } },
  { type = "trigger_dialogue", params = { scene = "time_stop_off" } },
]

[[instructions]]
id = "time_stop_off_in_h"
label = "在H中取消时停"
type = "arts"
sub_type = "ARTS"
sub_category = "time_stop"
time_cost = 1
priority = 50
premises = ["PRIMARY_TIME_STOP", "IS_H", "TIME_STOP_ON", "TIRED_LE_84"]
effects = [
  { type = "time_stop_carry_stop" },
  { type = "time_stop_free_stop" },
  { type = "time_stop_off" },
  { type = "set_field", params = { path = "h_state.time_stop_release", value = true } },
  { type = "trigger_dialogue", params = { scene = "time_stop_off_in_h" } },
]

[[instructions]]
id = "carry_target"
label = "搬运对方"
type = "arts"
sub_type = "ARTS"
sub_category = "time_stop"
time_cost = 1
priority = 50
premises = ["INTERMEDIATE_TIME_STOP", "NOT_H", "TIME_STOP_ON", "NOT_CARRY_ANYBODY_IN_TIME_STOP", "HAVE_TARGET", "TIRED_LE_84"]
effects = [
  { type = "time_stop_carry" },
  { type = "trigger_dialogue", params = { scene = "carry_target" } },
]

[[instructions]]
id = "stop_carry_target"
label = "停止搬运对方"
type = "arts"
sub_type = "ARTS"
sub_category = "time_stop"
time_cost = 1
priority = 50
premises = ["INTERMEDIATE_TIME_STOP", "NOT_H", "TIME_STOP_ON", "TARGET_IS_CARRIED_IN_TIME_STOP", "TIRED_LE_84"]
effects = [
  { type = "time_stop_carry_stop" },
  { type = "trigger_dialogue", params = { scene = "stop_carry_target" } },
]
