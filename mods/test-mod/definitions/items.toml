# mods/test-mod/definitions/items.toml
# 注释：物品定义 + 服装 + H 道具（精准复刻 erArk）

[items.healing_potion]
id = "healing_potion"
name = "回血丹"
type = "consumable"
stackable = true
use = "self"
effects = [{ type = "modify_attribute", params = { attr = "hp", value = 50, target = "self" } }]

[items.iron_sword]
id = "iron_sword"
name = "铁剑"
type = "weapon"
stackable = false
use = "equip"
attack_bonus = 15

[items.leather_armor]
id = "leather_armor"
name = "皮甲"
type = "armor"
stackable = false
use = "equip"
defense_bonus = 10

[items.herb]
id = "herb"
name = "草药"
type = "material"
stackable = true

# ═══════════════════════════════════════════════════════════
# H 药物（use=h_drug）——精确复刻 erArk 效果
# ═══════════════════════════════════════════════════════════
# 注释：一次性药物（body_slot=-1，不占槽位，即时效果）

[items."润滑液"]
id = "润滑液"
name = "润滑液"
type = "consumable"
stackable = true
use = "h_drug"
body_slot = -1
effects = [{ type = "apply_lubricant", params = { target = "selected" }}]

[items."媚药"]
id = "媚药"
name = "媚药"
type = "consumable"
stackable = true
use = "h_drug"
body_slot = -1
effects = [{ type = "apply_aphrodisiac", params = { target = "selected" }}]

[items."跳蛋"]
id = "跳蛋"
name = "跳蛋"
type = "consumable"
stackable = true
use = "h_drug"
body_slot = -1
effects = [{ type = "apply_instant_toy", params = { target = "selected", part = "clit", base = 50 }}]

# 注释：持续性药物（body_slot 8-12，占槽位，有持续时间）
