"润滑" = { type = "number", default = 0, category = "parameter", display = true, display_group = "行为参数", daily_reset = true }
"习得" = { type = "number", default = 0, category = "parameter", display = true, display_group = "行为参数", daily_reset = true }
"恭顺" = { type = "number", default = 0, category = "parameter", display = true, display_group = "行为参数", daily_reset = true }
