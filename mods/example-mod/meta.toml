# ═══════════════════════════════════════════════════════════════════
# example-mod —— 教学范例模组（照猫画虎用）
# 本模组每个文件都是「真实可跑 + 教学注释」：去掉注释就是完整数据。
# 复制到你的 mod 目录（mods/你的mod名/），改 id/name 即可运行。
# ═══════════════════════════════════════════════════════════════════

# ────────────────────────────────────────────────────────────────────
# 数据层级图（谁覆盖谁，低 → 高）—— 全项目通用，务必先看懂这张图
# ────────────────────────────────────────────────────────────────────
#   ① 插件默认层   src/plugins/*/data/default/（h-core 已提供全套
#                  属性/能力/天赋/装备槽/关系/状态——你不写就用这些）
#        ↓ 合并规则（每层之间都一样）：
#        ↓   同名字段：下层覆盖上层
#        ↓   对象：深合并（下层独有 key 保留）
#        ↓   数组：整表替换（写数组 = 完全替换，不是追加！）
#        ↓   = null：删除该字段
#   ② mod 定义层   definitions/*.toml（本 mod：改默认值/新增属性/删）
#        ↓ 同规则
#   ③ 角色模板     templates/character/*.toml（可复用初始卡，只写差分）
#        ↓ extends 链 + 同规则
#   ④ 具体角色     characters/roster.toml / named/{id}/base.toml
#                  （相对模板只写差分；named 覆盖同名 roster 条目）
#        ↓
#   ⑤ 存档         运行时权威：读档后数据文件不再生效
# ────────────────────────────────────────────────────────────────────
# 「差分」含义：每个文件头注释会告诉你它是第几层。写数据时只写
# 「和上一层不一样的地方」——没写的字段自动继承上一层。写全量也行
# （写了就是最终值），但会脱离继承：上层默认更新后你不再跟随。
# ═══════════════════════════════════════════════════════════════════

[meta]
# id：全局唯一（文件名无关，引擎按此识别模组）
id = "example-mod"
# name：显示名
name = "范例模组"
# version：semver，必须
version = "1.0.0"
# title：标题界面显示的文字
title = "范例模组"
# description：模组简介
description = "教学范例模组：每个文件都带注释，照猫画虎用"
# player_character：玩家实体 ID（必须在 roster.toml 中定义，必写）
player_character = "player"
# starting_location：新游戏起始地点 ID（必须在 maps/locations/ 中存在）
starting_location = "山村"

# 加载画面素材（可选，2026-08-10 方案 B）——引擎启动期间显示：
#   loading_video：视频（优先）；loading_image：图片/GIF
#   路径相对 mod 根（如 "assets/loading.gif"，素材放本 mod 的 assets/ 下）；
#   不声明 → 引擎用闪烁"加载中……"文字 fallback（不报错）
# loading_image = "assets/loading.gif"
# loading_video = "assets/loading.mp4"

# [creation]：可选——新游戏的角色创建流程（不写 = 跳过创建直接进游戏）
# steps 字段：type = "input"（输入文本，field=存到哪个字段/prompt=提示语）
#           或 "choose"（选项，choices=选项列表，选中的值存到 field）
[creation]
steps = [
  { type = "input", field = "name", prompt = "你叫什么名字？" },
  { type = "choose", field = "背景", prompt = "你的出身是？", choices = ["山村少年", "商贾之子", "江湖散人"] }
]

# [dependencies]：可选——本模组依赖的插件（semver 版本约束，不满足 → 加载报错）
# 插件 ID 见各插件 plugin.toml 的 [meta].id；例：
# dependencies = [
#   { plugin = "combat-wuxia", version = "^1.0.0" },
#   { plugin = "map-system", version = ">=1.0.0" }
# ]
