# WORK 类型指令
# 映射自 erArk InstructConfig.csv (WORK 行) + Behavior_Effect.csv
# 映射参考: .superpowers/instruction-mapping-ref.md

[[instructions]]
id = "official_work"
label = "处理公务"
type = "work"
time_cost = 60
priority = 50
premises = ["NOT_H", "IN_DR_OFFICE", "NO_TARGET_OR_TARGET_CAN_COOPERATE", "HAVE_OFFICE_WORK_NEED_TO_DO", "TIRED_LE_74"]
effects = [
  { type = "settle_favorability" },
  { type = "settle_state", params = { state = "体力", baseValue = 30, negate = true } },
  { type = "settle_state", params = { state = "气力", baseValue = 30, negate = true } },
  { type = "settle_trust" },
  { type = "settle_state", params = { state = "习得" } },
  { type = "settle_favorability", condition = "target.experience.82 >= 1" },
  { type = "settle_favorability", condition = "player.experience.82 >= 1" },
  { type = "check_facility_damage" },
]

