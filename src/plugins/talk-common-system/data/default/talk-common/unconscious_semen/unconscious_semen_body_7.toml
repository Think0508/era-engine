# 无意识醒来精液口上（睡奸/时停/催眠通用——settle_unconscious_semen_and_cloth 触发）
# 来源：erArk data/talk/system/second_unconscious_semen.csv（2026-08-16 转换）
# 部位编号 = 引擎 BODY_PART_CID 体系（非 erArk 编号）：0 头发 1 面 2 嘴 3 胸 5 手 6 阴道
#   7 子宫 8 肛 9 脚 10 尿道 11 腿；erArk 映射 9→10 / 10→11 / 11→9；
#   跳过 4 腋 / 12 尾巴 / 13 角（引擎无对应部位，grill 定案）
# 触发：h-npc-ai getText('in_unconscious_cum_on_body_{引擎编号}', targetId) → {Name} 替换
# ⚠️ mod 可覆盖（talk-common 合并语义：mods/{mod}/definitions/talk-common/ 同名 variable 覆盖）
# 原文为第三人称"她"视角（方舟向）——武侠 mod 如需改人称/文风，覆盖本文件即可

# ── 子宫（引擎编号 7；erArk 7）──
variable = "in_unconscious_cum_on_body_7"
description = "无意识醒来发现该部位有精液的旁白（精液量分级选文）"

[[entries]]
conditions = "selected.body_semen.子宫.1 < 10"
context = "\n{Name}感到腹部深处有一丝微妙的异样感，仿佛有什么微量的温热液体渗入了她的子宫。\n这种感觉虽然微弱，却无比清晰，像是一股温暖的潮流在她的腹腔里轻轻荡漾。\n她下意识地轻抚小腹，能感觉到一种微妙的充实感，就像有一小汪液体积聚在她的子宫里，随着她的移动轻轻晃动。\n她皱起眉头，困惑地思考着这种奇怪的感觉从何而来。\n她试着收缩阴道肌肉，却没有感到任何液体流出，那些精液似乎已经完全灌入了她的子宫深处，被牢牢锁住了。\n这种被内射的感觉让她心慌意乱，她不停地按摩小腹，希望那些液体能够排出体外，却只感到那股温热感越发明显，仿佛那些精液正在她的子宫内壁上扩散开来。\n"

[[entries]]
conditions = "selected.body_semen.子宫.1 >= 10 && selected.body_semen.子宫.1 < 50"
context = "\n{Name}感到腹部深处有种奇妙的充实感，仿佛有一股温热的液体被注入到了她的子宫里。\n她能清晰地感受到那些精液在她的子宫腔内缓缓流动，带来一种温暖而沉重的饱胀感。\n她本能地按压小腹，感觉自己的子宫似乎被撑大了一些，轻轻一按就能感受到内部液体的流动和轻微的起伏。\n那种被填满的感觉既陌生又强烈，让她的呼吸变得急促。\n更令她不安的是，无论她如何挤压小腹或收缩阴道肌肉，那些精液似乎都被牢牢地锁在她的子宫深处，无法排出。\n她能感觉到那些液体的重量和热度，仿佛一个精液做的热水袋放在她的腹腔中，散发着一种异样的温度。\n她不停地按摩腹部，却只是让那些精液在子宫内更均匀地分布，那种被内射的强烈感受让她既恐慌又羞耻，却又无能为力。\n"

[[entries]]
conditions = "selected.body_semen.子宫.1 >= 50 && selected.body_semen.子宫.1 < 150"
context = "\n{Name}感到腹部深处有种强烈的胀痛感，就像有人往她的子宫里灌入了一大桶温热的液体。\n她按住小腹，能明显感觉到腹部隆起了一个小小的弧度，子宫被精液撑大的感觉清晰得令人害怕。\n那些大量的精液完全充满了她的子宫腔，甚至撑开了子宫壁，让她感到一种前所未有的饱胀和沉重，仿佛下腹部被塞入了一个沉甸甸的热水袋。\n她能清晰地感受到那些液体在她体内的温度和重量，随着她的每一次移动都在体内晃动，就像是她的子宫变成了一个装满精液的容器，而那些精液的稠度和粘性让这种晃动变得缓慢而明显。\n她痛苦地弯下腰，双手压住小腹，试图减轻那种胀痛感，却只让自己更加清晰地感受到体内那大量精液的存在。\n她拼命地收缩阴道和腹部肌肉，想要排出那些液体，却发现那些精液似乎被锁在了最深处，无论她如何用力都无法将它们挤出，只能感到那些浊液在子宫内缓缓流动，引起一阵阵奇怪的温热感。\n那种被大量内射的感觉让她既恶心又恐惧，她不停地按摩腹部，却只能感受到那些精液在她的子宫里滑动摩擦，仿佛在宣告对她身体的占有。\n"

[[entries]]
conditions = "selected.body_semen.子宫.1 >= 150 && selected.body_semen.子宫.1 < 500"
context = "\n{Name}突然感到腹部一阵剧烈的疼痛和异常的胀大感，仿佛有人在她的子宫里灌满了滚烫的液体。\n她低头看向自己的腹部，发现小腹已经明显隆起，就像怀孕三个月的样子，被大量精液撑大的子宫清晰可见。\n她能感受到那些精液在子宫内不断挤压着子宫壁，每一次心跳都会带来一阵阵压迫感和胀痛感，就像有无数小小的浪潮不断冲击着她的内脏。\n被精液填满到极限的子宫变得异常敏感，她身体的每一个动作、每一次呼吸甚至每一次心跳都会引起内部液体的晃动，带来一种令人作呕的满溢感和压迫感。\n她感到小腹沉重得像灌了铅，那些滚烫的精液不断散发着热量，让她的下腹部变得异常灼热，就像一个装满滚烫水的热水袋被塞入腹中。\n那种被彻底侵占和填满的感觉让她既恶心又恐惧，她拼命地揉搓小腹，试图减轻那种可怕的胀满感，却只是让体内的精液更加剧烈地晃动，引起新一轮的不适。\n她能清晰地感受到子宫颈被精液压迫的感觉，仿佛有什么东西随时会从那里溢出，却又被某种力量牢牢堵住，只能眼睁睁地感受着体内那些精液的重量和热度，无法摆脱那种被彻底玷污的感觉。\n"

[[entries]]
conditions = "selected.body_semen.子宫.1 >= 500 && selected.body_semen.子宫.1 < 1000"
context = "\n{Name}突然感到一阵剧烈的腹痛，随即便感到子宫被一股巨大的压力撑开到了极限，腹部迅速膨胀起来。\n她看着自己的小腹在短短几秒内膨胀得如同怀孕五六个月一般，皮肤被撑得发亮，甚至能看到一些微微凸起的血管。\n她能清晰地感觉到自己的子宫被那些精液撑到了极限，子宫壁被迫拉伸变薄，里面的每一滴液体都清晰可感，随着她的动作在体内晃荡，发出令人羞耻的水声。\n那些精液的量多得令人发指，让她的整个下腹部都变得沉重而灼热，每走一步都会带来一阵剧烈的晃动和不适。\n她痛苦地抱住自己隆起的腹部，感受着里面那些精液的热度和重量，仿佛自己的子宫已经变成了一个巨大的精液容器，被灌得满满当当。\n当她试图挤压腹部时，她能感觉到那些精液在子宫内四处流动，但无论如何用力，那些液体都无法从子宫颈排出，仿佛被某种力量牢牢封住。\n那种被异物极度撑满的感觉让她痛苦不堪，她不断地揉搓自己的腹部，试图减轻那种可怕的胀痛感，却只能感受到那股温热的液体在体内翻腾，带来一阵阵恶心和眩晕。\n当她试图起身时，那巨大的腹部重量让她几乎站立不稳，每一步都伴随着腹内精液的晃动和剧烈的不适，让她不得不弯腰扶墙，喘息着适应这种不正常的状态。\n"

[[entries]]
conditions = "selected.body_semen.子宫.1 >= 1000"
context = "\n{Name}突然感到腹部一阵剧烈的痛苦和撕裂般的胀感，随即她的腹部以肉眼可见的速度迅速膨胀起来。\n她看着自己的小腹在瞬间膨胀得就像怀孕八九个月一样，腹部皮肤被撑得发亮，血管清晰可见，肚脐甚至向外凸出。\n那些精液的量如此之大，令她的子宫被迫扩张到不可思议的程度，撑满了整个腹腔，挤压着周围的器官。\n这种极度膨胀的感觉带来了剧烈的疼痛，她能感觉到自己的子宫被撑到极限，随时可能破裂，子宫壁被拉伸得如同薄膜一般，内部的每一滴精液都能被清晰地感知到。\n她痛苦地蜷缩在地上，双臂环抱着自己巨大的腹部，能感受到里面液体随着她的每一次移动而剧烈晃动，发出清晰可闻的水声，就像一个装满液体的气球。\n她拼命地揉搓自己的腹部，想要减轻那种可怕的胀痛感，却只能感受到那些精液在体内激烈晃动，带来一阵阵恶心和眩晕，仿佛要把她体内的其他器官都挤碎一般。\n当她试图起身时，那巨大的腹部重量让她几乎站立不稳，每一步都伴随着腹内精液的晃动和剧烈的不适，让她不得不弯腰扶墙，只能像一个被精液撑大的人形容器一样，喘息着适应这种不正常的状态。\n每一个微小的动作都会带来体内液体的剧烈晃动和排山倒海般的不适，让她只能保持同一个姿势，这种被异物极度占据和填满的感觉让她陷入一种超越羞耻和恐惧的恍惚状态。\n"
