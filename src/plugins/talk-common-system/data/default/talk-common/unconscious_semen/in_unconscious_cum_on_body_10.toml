# 无意识醒来精液口上（睡奸/时停/催眠通用——settle_unconscious_semen_and_cloth 触发）
# 来源：erArk data/talk/system/second_unconscious_semen.csv（2026-08-16 转换）
# 部位编号 = 引擎 BODY_PART_CID 体系（非 erArk 编号）：0 头发 1 面 2 嘴 3 胸 5 手 6 阴道
#   7 子宫 8 肛 9 脚 10 尿道 11 腿；erArk 映射 9→10 / 10→11 / 11→9；
#   跳过 4 腋 / 12 尾巴 / 13 角（引擎无对应部位，grill 定案）
# 触发：h-npc-ai getText('in_unconscious_cum_on_body_{引擎编号}', targetId) → {Name} 替换
# ⚠️ mod 可覆盖（talk-common 合并语义：mods/{mod}/definitions/talk-common/ 同名 variable 覆盖）
# 原文为第三人称"她"视角（方舟向）——武侠 mod 如需改人称/文风，覆盖本文件即可

# ── 尿道（引擎编号 10；erArk 9）──
variable = "in_unconscious_cum_on_body_10"
description = "无意识醒来发现该部位有精液的旁白（精液量分级选文）"

[[entries]]
conditions = "selected.body_semen.尿道.1 < 10"
context = "\n{Name}感到尿道口有一丝微妙的湿润感，仿佛有一小滴液体停留在那里。\n她小心翼翼地用手指轻触私处，发现指尖沾上了一点点黏稠的白色液体。\n她困惑地看着这滴不同于尿液的物质，心中涌起一阵不安。\n她能感觉到尿道内有一种异样的充盈感，仿佛还有更多液体藏在深处。\n当她走动时，能感觉到尿道内有微量液体的轻微流动，带来一种瘙痒和刺激感。\n她尝试像排尿一样用力，却只挤出了几滴白色的精液，远不足以清空尿道内的所有液体。\n这种被侵入最私密部位的感觉让她既恐慌又羞耻，她反复擦拭尿道口，却无法解决深处的异物感，只能忍受那种微妙的不适和时刻提醒她的存在感。\n"

[[entries]]
conditions = "selected.body_semen.尿道.1 >= 10 && selected.body_semen.尿道.1 < 50"
context = "\n{Name}感到尿道口被一股温热的液体覆盖，同时尿道内部传来明显的充盈感。\n她慌张地用手按压尿道区域，顿时有一股白色的粘稠液体从尿道口涌出，顺着阴唇流下。\n那些精液不只是在尿道口，她能清晰地感觉到尿道深处甚至膀胱中都充满了那些温热的液体，带来一种持续的压力和胀痛感。\n每走一步，她都能感觉到膀胱内的精液晃动，刺激着尿道内壁，带来一种既痛苦又异样的感觉。\n她试图像排尿一样释放那些液体，用力挤压下腹部，果然有一股白浊从尿道口喷出，却远不足以排空所有液体。\n那种尿道被玷污的感觉让她既恶心又不安，她不停地用纸巾擦拭私处，却无法摆脱尿道深处那种持续的充盈感和刺痛感，仿佛那些精液已经深入到了她无法触及的部位。\n"

[[entries]]
conditions = "selected.body_semen.尿道.1 >= 50 && selected.body_semen.尿道.1 < 200"
context = "\n{Name}感到尿道和膀胱突然被一股强烈的压力和热流冲击，随即一股白色液体从她的尿道口涌出，仿佛失控的排尿一般。\n她看着那些精液像小溪一样从尿道口源源不断地流出，顺着阴唇和大腿内侧缓慢流淌，逐渐形成一条明显的湿痕。\n她能清晰地感受到膀胱被那些浓稠的精液充满，带来一种强烈的胀痛和灼热感，就像憋尿太久却又无法完全排空的痛苦。\n当她尝试控制时，更多的精液就会不受控制地从尿道溢出，每一次都带来一种类似排尿却完全不同的羞耻感受。\n她痛苦地弯下腰，双手按压小腹，试图加速排出那些侵入的液体，白浊的液体随着她的按压变得更加汹涌。\n那种私密尿道被异物完全占据的感觉让她既恶心又羞耻，精液顺着尿道流出时的触感清晰得令人发狂，那种滑腻的液体摩擦着尿道内壁的每一寸，带来一种难以言喻的侵犯感。\n她不停地擦拭私处，却发现新的精液不断从深处涌出，那股浓郁的腥臊味从她的下体散发出来，提醒着她那最隐私的通道已被彻底污染的事实。\n"

[[entries]]
conditions = "selected.body_semen.尿道.1 >= 200 && selected.body_semen.尿道.1 < 400"
context = "\n{Name}感到尿道和膀胱突然被一股猛烈的压力冲击，随即大量白色液体从她的尿道口喷涌而出，就像失禁一样完全无法控制。\n她看着那些精液像喷泉一样从尿道口喷射而出，力道之大甚至形成了一道小弧线，落在地板上形成了一个迅速扩大的白色水洼。\n她能清晰地感受到膀胱和整个尿道都被那些浓稠的精液完全填满，带来一种极度的胀痛和灼热感，就像膀胱被注入了太多的液体却无法完全排出。\n那些精液的量如此之大，以至于她的下腹部传来阵阵刺痛，每一次心跳都能感觉到膀胱内的液体在晃动。\n她痛苦地蹲下身，双手压住小腹，试图加速排出那些侵入的液体，却只是让喷射的力度和速度更大，白浊的液体从尿道喷出时带来一种难以形容的羞耻快感。\n那种尿道被完全占据和冲刷的感觉让她面红耳赤，既恐惧又痛苦，每一滴精液离开尿道时都带来一种异样的刺激，让她的身体不由自主地颤抖。\n她拼命地用纸巾堵住尿道口，希望阻止液体继续流出，却发现精液的压力太大，很快就浸透了纸巾，继续向外渗透，那种源源不断的流动感让她意识到膀胱里储存了多么大量的精液。\n"

[[entries]]
conditions = "selected.body_semen.尿道.1 >= 400"
context = "\n{Name}突然感到下腹部一阵剧烈的痛苦和膨胀感，仿佛膀胱要爆炸一般，随即一股巨大的精液洪流从她的尿道喷射而出。\n她看着乳白色的液体以惊人的压力从尿道口喷涌而出，形成一道长长的弧线，地面上迅速形成了一个不断扩大的精液湖泊。\n她的膀胱被那些精液撑到了极限，带来了一种难以忍受的压力和胀痛，就像是有人在她的膀胱里塞了一个不断膨胀的气球。\n那些精液的量完全超出了她的想象，不断从尿道喷涌而出，冲刷着尿道的每一寸内壁，带来一种介于极度疼痛和变态快感之间的奇怪感受。\n她双腿不停地颤抖，几乎站立不稳，只能一手撑墙，一手按压小腹，试图加速排出体内的异物，却只是让精液喷射得更远更猛。\n那种尿道被彻底侵犯和扩张的感觉让她既恶心又羞耻，尤其是那些精液从尿道内高压喷出时的感觉，就像是被什么东西从内部贯穿一样清晰而强烈。\n她能感觉到自己的整个下体都湿透了，从阴唇到大腿，从会阴到膝盖，全都被那些喷射的精液弄得黏腻不堪，她疯狂地用衣物和纸巾擦拭，却无法跟上精液涌出的速度。\n"
