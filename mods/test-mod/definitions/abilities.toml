# test-mod 示范能力定义（标准角色契约 spec §10.1 —— mod 扩展规则演示）
# 华山剑法：condition-registry 测试引用（character.令狐冲.abilities.华山剑法.level >= 3）。
# 按契约：mod 新增能力必须经 definitions/abilities.toml 定义，禁止角色数据裸字段。

[abilities]
[abilities."华山剑法"]
name = "华山剑法"
type = "active"
max_level = 10
tags = ["combat_active", "sword", "combat"]
description = "华山派基础剑法（test-mod 示范：mod 自定义能力）"

[abilities."混元功"]
name = "混元功"
type = "passive"
max_level = 10
passive_kind = "内功"
tags = ["combat_passive", "combat"]
description = "华山派内功（test-mod 示范：roster 简写引用）"

[abilities."基础攻击"]
name = "基础攻击"
type = "active"
max_level = 10
tags = ["combat_active", "combat"]
description = "普通攻击（test-mod 示范：roster 简写引用）"

[abilities."采药"]
name = "采药"
type = "active"
max_level = 10
tags = ["combat_active", "combat"]
description = "野外采药（test-mod 示范：roster 简写引用）"

[abilities."学识"]
name = "学识"
type = "passive"
max_level = 10
tags = ["knowledge"]
description = "学识（confinement-system 逃脱公式 knowledge 技能来源）"

# 属性有效值层 计划二夹具：声明式来源（被动技能 → attribute_mods，per_level 按技能等级缩放）
# 新增而非改既有能力：混元功等被 roster.toml/npc.toml 与其他测试引用，改它会波及其他用例。
# display = false（不在角色面板显示）；无生产消费方读取它。
[abilities."修正测试棍法"]
name = "修正测试棍法"
type = "passive"
max_level = 10
tags = ["combat_passive", "combat"]
display = false
description = "属性修正夹具（1 级 +10，每多 1 级再 +2）"
attribute_mods = [ { attr = "修正测试值", flat = 10, per_level = 2 } ]

# ════════════════════════════════════════
# 秘籍-技能系统演示（2026-09-23）——配套 definitions/manuals.toml + items.toml 的两本秘籍
# 「基础掌法」：主动技能（用一次涨一次经验，上限由「初级拳法」进度钳制）
# 「龟息功」：内功 = 分层被动技能 + 可装配（equipped_mods 存在即可装配；层数随秘籍）
# ════════════════════════════════════════
[abilities."基础掌法"]
name = "基础掌法"
type = "active"
max_level = 10
category = "拳掌"
power = 50
cost = 5
tags = ["combat_active", "拳掌"]
description = "拳脚入门招式（manual-system 演示：秘籍第 1 层授予；显式 cost 覆盖品级表自动蓝耗）"

[abilities."龟息功"]
name = "龟息功"
type = "passive"
max_level = 10
passive_kind = "内功"
tags = ["combat_passive"]
description = "内功心法（manual-system 演示：可装配，装配期间提供属性加成）"
equipped_mods = [ { attr = "力道", flat = 20, per_level = 10 }, { attr = "轻灵", flat = 3 } ]
