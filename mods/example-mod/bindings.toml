# ═══════════════════════════════════════════════════════════════════
# bindings.toml —— 第②层（mod 定义层）：属性绑定（重命名映射）
# ═══════════════════════════════════════════════════════════════════
# 什么时候需要写这个文件？
#   → 只有当 mod 启用了某个插件、且该插件声明了 required_attributes 时。
#   → 每个绑定 = 「插件要的通用属性名 → 你的属性名」。
#   → 你的 mod 不启用战斗插件，就不用写绑定。
#
# 注意：这个文件解决的是「插件 ↔ mod」的映射。h-core 代码硬编码的属性名
# （体力/好感度/快乐刻印…）不能靠它改名——想改引擎已有属性名要走
# 对账表 + spec §11 归档流程。自由命名的只有你自己新增的自定义属性。
# ═══════════════════════════════════════════════════════════════════

# 示例：combat-base 插件要求 hp/mp/attack，本 mod 把它们映射到同名属性
# （h-core 默认属性就有 hp/mp/attack；如果你自定义了「气血」，可以写
#  hp = "气血" 让插件把伤害扣到气血上）
[bindings.combat-base]
hp = "hp"
mp = "mp"
attack = "attack"
