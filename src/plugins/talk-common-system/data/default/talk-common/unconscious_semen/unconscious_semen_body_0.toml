# 无意识醒来精液口上（睡奸/时停/催眠通用——settle_unconscious_semen_and_cloth 触发）
# 来源：erArk data/talk/system/second_unconscious_semen.csv（2026-08-16 转换）
# 部位编号 = 引擎 BODY_PART_CID 体系（非 erArk 编号）：0 头发 1 面 2 嘴 3 胸 5 手 6 阴道
#   7 子宫 8 肛 9 脚 10 尿道 11 腿；erArk 映射 9→10 / 10→11 / 11→9；
#   跳过 4 腋 / 12 尾巴 / 13 角（引擎无对应部位，grill 定案）
# 触发：h-npc-ai getText('in_unconscious_cum_on_body_{引擎编号}', targetId) → {Name} 替换
# ⚠️ mod 可覆盖（talk-common 合并语义：mods/{mod}/definitions/talk-common/ 同名 variable 覆盖）
# 原文为第三人称"她"视角（方舟向）——武侠 mod 如需改人称/文风，覆盖本文件即可

# ── 头发（引擎编号 0；erArk 0）──
variable = "in_unconscious_cum_on_body_0"
description = "无意识醒来发现该部位有精液的旁白（精液量分级选文）"

[[entries]]
conditions = "selected.body_semen.头发.1 < 10"
context = "\n{Name}感到头发上有一点点湿润感，她轻轻抚摸头发，发现指尖沾上了一小滴白色液体。\n她困惑地揉搓指尖，那微量的精液黏在她的手指间拉出一条细丝。\n她皱着眉头，仔细嗅了嗅，一股淡淡的腥臭味道钻入鼻腔，让她忍不住往后退了一步。\n她环顾四周，想找出这莫名其妙的液体来源，却一无所获，只能用纸巾擦拭掉那微小的痕迹，心里却难以平静，总觉得有什么不对劲的事情发生了。\n"

[[entries]]
conditions = "selected.body_semen.头发.1 >= 10 && selected.body_semen.头发.1 < 50"
context = "\n{Name}感到头发上湿漉漉的，她用手指梳理头发时，发现有不少粘稠的白色液体附着在发丝上。\n那些精液像胶水一样把几缕头发黏在了一起，她试图分开这些被黏住的头发，却导致更多精液沾到了她的手掌上。\n她嫌恶地甩了甩手，那些精液却拉出长长的丝线，散发出一股浓烈的咸腥味。\n她急忙拿出几张纸巾，一边擦拭头发一边擦手，可那些黏糊糊的白色液体似乎无处不在，越擦越多，搞得她既恼火又困惑，不知道自己怎么会莫名其妙地被弄成这副模样。\n"

[[entries]]
conditions = "selected.body_semen.头发.1 >= 50 && selected.body_semen.头发.1 < 400"
context = "\n{Name}感到一股温热的液体大量浇在她的头顶，顺着头皮流向各个方向。\n她惊慌地用手摸了摸，只觉得整个头发都被黏糊糊的精液浸透了，就像刚从水里捞出来一样湿透。\n那些浓稠的白色液体从她的发丝间滴落，有些顺着她的额头流下，差点流进眼睛里。\n她能清晰地感觉到精液的热度和那股刺鼻的腥臭味，仿佛自己站在精液的小雨中一般。\n她慌乱地用双手反复擦拭，却适得其反，只是把那些液体涂抹得更均匀了。\n每一次动作都伴随着黏腻的水声，精液从头顶不断滴落到她的肩膀和衣服上，让她浑身上下黏糊糊的，无处可逃。\n"

[[entries]]
conditions = "selected.body_semen.头发.1 >= 400"
context = "\n{Name}被一股犹如瀑布般的精液彻底淋透，她整个头部完全被白色浊液覆盖，仿佛戴了一顶由精液构成的帽子。\n无数精液从她的头顶倾泻而下，完全湿透的发丝结成了一缕缕黏腻的绳状，沉重地贴在她的头皮和脸颊上。\n大量浓稠的白色液体不断从她的头顶流下，覆盖了她的前额、眉毛、睫毛，甚至流进了她的眼睛和鼻孔，让她几乎无法正常呼吸和睁眼。\n她张开嘴想要尖叫，却有更多的精液趁机流入她的口中，呛得她咳嗽连连，口腔里充斥着那股令人作呕的腥膻味。\n她拼命甩头，却只是让更多精液飞溅到周围，形成一圈白色的水花，同时更多的精液顺着她的脖子流到衣服里，让她浑身上下每一寸皮肤都湿漉漉的。\n她试图用手抹去脸上的精液，但那量实在太多，仿佛永远也擦不干净，每擦掉一层，就有新的一层从头发里渗出来。\n她的衣服已经完全被精液浸透，紧贴在身上，透出肉色，而她的头发也因为精液的重量贴在头皮上，像是刚洗过澡一样服帖，只不过洗的不是水，而是男人的精液。\n"
