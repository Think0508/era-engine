id = "touch_head"
label = "摸头"
erark_id = "5002"
erark_behavior = "TOUCH_HEAD"
erark_h_mode_show_type = 1
erark_tired_type = 2
category = "obscenity"
sub_category = "touch"
time_cost = 10
priority = 50
judge_base = 200
premises = ["HAVE_TARGET", "T_NORMAL_56_OR_UNCONSCIOUS_FLAG", "NOT_H", "NOT_SHOW_NON_H_IN_HIDDEN_SEX", "TIRED_LE_74", "HP_G_1", "DRUNK_LEVEL_NOT_3"]
