# ═══════════════════════════════════════════════════════════════════
# maps/graph/山村.toml —— 移动图（可达性）
# 移动 = 沿图边走。from/to 必须是存在的地点 ID；time_cost = 移动耗时分钟。
# 图边决定"不可达"检查：无任何边指向、也无 parent 的顶级地点会被 warning
# 「可能设计遗漏」。所以顶级地点至少被一条边指向。
# ═══════════════════════════════════════════════════════════════════

[[edges]]
from = "山村"
to = "集市"
time_cost = 30

[[edges]]
from = "集市"
to = "山村"
time_cost = 30
