# 注释：H 原生药物（grill Q1：原生通用 = H 系统依赖批，plugins 层默认数据，mod 可 override）
# 数值来源：复刻攻略-猥亵-H系统专用/03-道具系统.md（erArk Item ID 100-108 公式逐条核对）
# 目标约定（2026-08-12 第四轮审计）：物品 effects 的执行目标由调用方 _targetIds 决定
# （useItem 的 targetId 参数 / 指令 target 解析），**不要在物品 effects 写 params.target**
# （引擎 handler 统一读 _targetIds，params.target 是死参数——曾误导；详见 docs/item-system.md §四）

