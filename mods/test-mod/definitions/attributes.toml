"欲情" = { type = "number", default = 0, category = "parameter", display = true, display_group = "行为参数", daily_reset = true }
"快乐" = { type = "number", default = 0, category = "parameter", display = true, display_group = "行为参数", daily_reset = true }
"先导" = { type = "number", default = 0, category = "parameter", display = true, display_group = "行为参数", daily_reset = true }
"屈服" = { type = "number", default = 0, category = "parameter", display = true, display_group = "行为参数", daily_reset = true }
"羞耻" = { type = "number", default = 0, category = "parameter", display = true, display_group = "行为参数", daily_reset = true }
"苦痛" = { type = "number", default = 0, category = "parameter", display = true, display_group = "行为参数", daily_reset = true }
"恐怖" = { type = "number", default = 0, category = "parameter", display = true, display_group = "行为参数", daily_reset = true }
"抑郁" = { type = "number", default = 0, category = "parameter", display = true, display_group = "行为参数", daily_reset = true }
"反感" = { type = "number", default = 0, category = "parameter", display = true, display_group = "行为参数", daily_reset = true }

# eraTW 独有 PALAM，补充
"优越" = { type = "number", default = 0, category = "parameter", display = true, display_group = "行为参数", daily_reset = true }

# ════════════════════════════════════════
# MARK — 刻印（永久，不分级时为 0/1，分级时 0-3）
