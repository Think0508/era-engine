# 无意识H 结束/道具（sleep-system 插件默认层；mod 可覆盖）
# 来源：erArk InstructConfig.csv 6005/6106

[[instructions]]
id = "unconscious_h_end"
label = "结束无意识奸"
type = "sex"
sub_category = "base"
time_cost = 5
priority = 50
# erArk behavior: UNCONSCIOUS_H_END（6005，SEX/base）
# C3 修复（2026-08-11）：前提收紧为 T_UNCONSCIOUS_FLAG_1（睡眠无意识）——原 T_UNCONSCIOUS_FLAG(≥1)
# 会放行时停(3)/催眠(4-7)目标，而结束效果 unconscious_h_clear 无条件清 0 → 与其他结束路径
# （onHEnd 保留时停/催眠）语义打架；睡奸场景目标恒为睡眠(1)
premises = ["HAVE_TARGET", "T_UNCONSCIOUS_FLAG_1", "TIRED_LE_74"]
effects = [
  # 结束 H（h-core h_end_h——双方 H 状态重置）
  { type = "h_end_h", params = {} },
  # 目标恢复清醒（unconscious_h = 0 + unnormal 清 + sleeping 清）
  { type = "unconscious_h_clear", params = {}, target = "selected" },
  { type = "trigger_dialogue", params = { scene = "unconscious_h_end" } },
]

[[instructions]]
id = "sleeping_pills"
label = "安眠药"
type = "sex"
sub_category = "drug"
time_cost = 10
priority = 50
# erArk behavior: SLEEPING_PILLS（6106，SEX/drug）
# InstructConfig.csv L242 + Behavior_Data.csv L237（duration=10）+ Behavior_Effect.csv L236
#   （21 - 13 - 14 - 62 - 946 - 1007）
# 判定：handle_instruct.py:2763 显式 judge=_("药物") → judge_base=600；h-config 无“药物” → 不写 judge_class
# h_mode_show_type=2 → category/type=sex 自动 h_scene；前提显式含 TARGET_IS_H，无 tired 注入
premises = ["HAVE_TARGET", "T_NPC_NOT_ACTIVE_H", "TARGET_IS_H", "HAVE_SLEEPING_PILLS"]
effects = [
  # 21 ADD_INTERACTION_FAVORABILITY
  { type = "settle_favorability" },
  # 13 DOWN_BOTH_MEDIUM_HIT_POINT：双方体力 -30
  { type = "settle_hp_mp", target = "self", params = { hpValue = -1, mpValue = 0, degree = 1 } },
  { type = "settle_hp_mp", target = "selected", params = { hpValue = -1, mpValue = 0, degree = 1 } },
  # 14 DOWN_BOTH_MEDIUM_MANA_POINT：双方气力 -60
  { type = "settle_hp_mp", target = "self", params = { hpValue = 0, mpValue = -1, degree = 1 } },
  { type = "settle_hp_mp", target = "selected", params = { hpValue = 0, mpValue = -1, degree = 1 } },
  # 62 TARGET_ADD_SMALL_DISGUST
  { type = "settle_state", params = { state = "反感", baseValue = 5 } },
  # 946 USE_SLEEPING_PILLS：消耗玩家背包 1 个安眠药
  { type = "remove_item", target = "self", params = { itemId = "安眠药", count = 1 } },
  # 1007 TARGET_ADD_TIRED_TO_SLEEP：目标疲劳=160、熟睡=100、body_item[9] 8h、入睡
  { type = "target_add_tired_to_sleep", target = "selected" },
  { type = "trigger_dialogue", target = "selected", params = { scene = "sleeping_pills" } },
]
