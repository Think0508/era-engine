[meta]
id = "combat-wuxia"
name = "武侠回合制战斗"
version = "1.0.0"
description = "extends combat-base——六维/武学系数/风格三值/七系伤害公式/公式中间量通道/特殊系脚本/被动天赋编译"
extends = "combat-base"

dependencies = [
  { plugin = "combat-base", version = "^1.0.0" }
]

# 系别标签（技能 category 唯一系别；风格与被动等标签供过滤/加成）——中文键必须加引号
[optional_ability_tags]
"拳掌" = { description = "拳掌系（力道轴标准伤害公式）" }
"指腿" = { description = "指腿系（力道轴标准伤害公式）" }
"刀剑" = { description = "刀剑系（力道轴标准伤害公式）" }
"奇兵" = { description = "奇兵系（力道轴标准伤害公式）" }
"暗毒" = { description = "暗毒系（灵敏轴变体公式）" }
"气功" = { description = "气功系（per-skill 沙箱脚本伤害，无统一公式）" }
"异术" = { description = "异术系（per-skill 沙箱脚本伤害，无统一公式）" }
"轻功" = { description = "轻功系（特殊：命中/闪避计算用，非伤害系）" }
# 被动技能类别标签（2026-09-23 词表定稿：内功/护体/轻功/异术）——
# 「内功」由 manual-system 用作「已修炼内功」分组 + 装配候选；「护体」供 UI 分组与条件过滤
"内功" = { description = "内功心法（可装配的分层被动技能；manual-system 装配与分组）" }
"护体" = { description = "护体功（减伤/反伤类被动技能）" }

[optional_attributes]
weapon_base = { type = "number", description = "武器基础伤害（装备系统未开工前 = 0）" }

[data_dependencies]
provides = ["combat-wuxia:ready"]
depends_on = ["combat:ready"]