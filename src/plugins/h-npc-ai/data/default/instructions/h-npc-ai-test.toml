# ════════════════════════════════════════════════════════════════════════
# h-npc-ai 测试指令——【仅用于验证 NPC AI 机制，非正式游戏内容】
# 正式 H 指令由 docs/instruction-replication 批次落地（B3-B6，含部位 tag），
# 批次落地后本文件的指令将被 mod 层同 id 覆盖或作者自行删除。
# 用途：逆推/群交 AI 的部位过滤链、前提评估、执行管道的测试夹具。
# ════════════════════════════════════════════════════════════════════════

# 逆推部位 tag 词表（h-npc-ai 校验）：part:breast|clit|vagina|anus|urethra|womb（逆推）
