# chat 指令失败链默认通用口上（插件默认层，Layer 1）
# ============================================================
# ⚠️ 骨架说明（2026-08-xx，与 stroke 对齐）
# - 本文件只保留「示例 + 占位符」骨架，等待人工手写替换；不搬运 AI 生成/重复文本。
# - 口上仅为叙事，不影响 chat 失败链的 effect 数值结算。
# - 占位符格式：「聊天失败指令通用口上 N」（N 连续编号）。
# - 前提写法：基础失败组（erArk high_1）写 premise(high_1)；
#   高好感失败组写 premise(favorability_ge_3)。
# - mod 可覆盖：mods/[模组名]/definitions/talk-common/ 下同路径文件覆盖本默认层。

variable = "chat_failed"
description = "聊天指令失败链默认通用口上（mod 可覆盖）"

# ── 基础失败组 ────────────────────────────────────────────
# erArk 前提：high_1（权重前提，恒通过、权重 1）→ 条件：premise(high_1)。
# 原 20 条尴尬失败句；这里保留 1 示例 + 1 占位符。
[[entries]]
conditions = "premise(high_1)"
context = "{player.name}和{character.name}尝试聊天，但是由于彼此不熟悉，气氛很尴尬。"

[[entries]]
conditions = "premise(high_1)"
context = "聊天失败指令通用口上 1"

# ── 高好感失败组 ──────────────────────────────────────────
# erArk 前提：high_1 & favorability_ge_3（NPC 对玩家好感等级 ≥3）→ 条件：premise(favorability_ge_3)
#   （high_1 恒通过，不再重复写）。
# 原 8 条高好感失败句；这里保留 1 示例 + 1 占位符。
[[entries]]
conditions = "premise(favorability_ge_3)"
context = "{player.name}想要和{character.name}一起聊天，但气氛有些尴尬，像是没什么话说了。"

[[entries]]
conditions = "premise(favorability_ge_3)"
context = "聊天失败指令通用口上 2"