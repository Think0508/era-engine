# ═══════════════════════════════════════════════════════════════════
# templates/character/base-human.toml —— 第③层：角色模板（可复用初始卡）
# ═══════════════════════════════════════════════════════════════════
# 模板 = 「一组角色的公共初始数据」。相对第②层（属性默认值）只写差分：
#   写了 → 覆盖属性默认值；没写 → 自动用 attributes.toml 的 default。
#
# 模板继承（extends）规则：
#   - 子模板只写「和父模板不一样的地方」——差分
#   - 对象：深合并（子 key 覆盖父，父独有 key 保留）
#   - 数组：整表替换（子写数组 = 完全替换父的数组！）
#   - = null：删除父的该字段
#
# 本文件是「所有人类角色的公共卡」，子模板/具体角色在它之上继续差分。
# ═══════════════════════════════════════════════════════════════════

# id：模板 ID（roster 的 template 字段引用它，必写且全局唯一）
id = "base-human"
# name：模板显示名
name = "基础人类"

# base：基础属性（键 = attributes.toml 定义过的属性名）
# 这里写的值覆盖默认值；下面没写的属性（如 好感度=30）角色自动用默认
base = { hp = 100, mp = 50, attack = 10, defense = 5, speed = 5, "体力" = 100, "气力" = 100, "精力" = 100 }
