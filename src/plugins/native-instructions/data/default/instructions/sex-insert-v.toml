# 插件默认层指令（Layer 1）——SEX/insert V 链（B4-B7 批次 2026-08-26）
# 数据家：native-instructions
# 族：V 链（6301-6316）：入口/换体位走体位面板；12 体位为当前体位快捷动作；
#     深部 6315/6316 为已插入状态下的追加动作。
# 统一：duration=10 → time_cost=10；h_mode_show_type=2/tired_type=0 → category=sex 自动 h_scene。
# 前提全部使用可读名；erArk 原名/效果 ID 见各条注释（迁移铁律）。
# 效果 ID 对照（erArk Behavior_Effect + default.py）：
#   21 好感 / 11 12 13 14 15 16 双方小/中/大体力气力 / 1511 1514 自己小体力/中气力 /
#   22 信赖 / 1103 初V / 49 润滑 / 51 习得 / 52 尊重 / 53 好意 / 54 欲情 / 56 先导 /
#   57 屈服 / 58 羞耻 / 62 反感 / 70 自己射精欲 / CVE 4 61 65 60 经验 /
#   808 阴茎入V / 851-862 体位 / 122 V苦痛 / 131 V快感 / 145 膣技P调整

