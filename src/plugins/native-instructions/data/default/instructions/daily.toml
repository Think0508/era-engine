# ═══ chat 效果链（Behavior_Effect.csv 原链，逐条翻译，无合并省略）═══
[effect_blocks]
chat_fail_chain = [
  # 102 chat_failed：[12] DOWN_BOTH_SMALL_MANA_POINT（双方 -3/分 气力）
  { type = "settle_hp_mp", target = "self", params = { mpValue = -1, degree = 0 } },
  { type = "settle_hp_mp", target = "selected", params = { mpValue = -1, degree = 0 } },
]
chat_success_chain = [
  # 101 chat：21 - 12 - CVE_A2_E|80_G_1 - CVE_A1_E|80_G_1 - 53 - 55 - 501
  # 21 ADD_INTERACTION_FAVORABILITY
  { type = "settle_favorability" },
  # 12 DOWN_BOTH_SMALL_MANA_POINT
  { type = "settle_hp_mp", target = "self", params = { mpValue = -1, degree = 0 } },
  { type = "settle_hp_mp", target = "selected", params = { mpValue = -1, degree = 0 } },
  # CVE_A2_E|80_G_1：对方 对话经验(80) +1
  { type = "h_experience", target = "selected", params = { expId = "80", value = 1 } },
  # CVE_A1_E|80_G_1：自己 对话经验(80) +1
  { type = "h_experience", target = "self", params = { expId = "80", value = 1 } },
