# ═══════════════════════════════════════════════════════════
# 礼物（Task 6：give_gift effect 测试物品）
# ═══════════════════════════════════════════════════════════
[items."玉佩"]
id = "玉佩"
name = "玉佩"
type = "consumable"
use = ["gift"]
tags = ["gift", "jewelry"]
