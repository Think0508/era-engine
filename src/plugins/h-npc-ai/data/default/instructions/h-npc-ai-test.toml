# flag:first-time = 破处类（逆推对处女跳过）；flag:no-active = 非逆推类（逆推排除）

[[instructions]]
id = "h_npc_test_mouth"
label = "【测试】口交"
category = "sex"
sub_category = "base"
time_cost = 10
premises = ["HAVE_TARGET", "TARGET_IS_H"]
tags = ["part:mouth", "system:h-npc-ai-test"]
effects = [
  { type = "narrative_output", params = { text = "（测试指令）你低头服侍，对方呼吸急促起来。" } },
  { type = "modify_attribute", params = { attr = "体力", value = -5 } },
]

