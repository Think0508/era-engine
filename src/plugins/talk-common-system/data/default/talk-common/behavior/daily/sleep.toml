# sleep 指令默认通用口上（插件默认层，Layer 1）
# ============================================================
# ⚠️ 骨架说明（2026-08-25）
# - erArk data/talk/daily/sleep.csv 原 78 条为 AI 生成/重复长文本，不照搬。
#   本文件只保留「示例 + 占位符」骨架，等待人工手写替换。
# - 占位符格式：「睡觉指令通用口上 N」（N 连续编号）。
# - 口上仅为叙事，不影响 sleep 的跨天/结算/恢复数值。
# - 分组依据 erArk 原 CSV premise 列，映射到我们条件引擎：
#   high_1          → premise(high_1)（权重前提，恒通过、权重 1）
#   sleep_time      → game.time.hour >= 22 || game.time.hour <= 5（夜晚 22-5，erArk handle_sleep_time）
#   time_day        → game.time.hour >= 6 && game.time.hour <= 17（白天 6-17，erArk handle_time_day）
#   tired_100       → player.疲劳度 >= 160（疲劳条 100%=160，erArk handle_tired_100）
# - 世界观内容（源石/博士/罗德岛等）不保留；本 CSV 原句无方舟词。
# - mod 可覆盖：mods/[模组名]/definitions/talk-common/ 下同路径文件覆盖本默认层。

variable = "sleep"
description = "睡觉指令默认通用口上（角色通用口上 Layer 1 兜底，mod 可覆盖）"

# ── 无条件/高权重组 ──────────────────────────────────────
# erArk 前提：high_1（权重前提，恒通过、权重 1）→ 条件：premise(high_1)。
# 原 34 条为各种“躺下入睡”的长文本；保留 1 条简短示例 + 1 条占位符。
[[entries]]
conditions = "premise(high_1)"
context = "{player.name}躺在床上，闭上眼睛，呼吸渐渐平稳，慢慢睡着了。"

[[entries]]
conditions = "premise(high_1)"
context = "睡觉指令通用口上 1"

# ── 夜晚组 ──────────────────────────────────────────────
# erArk 前提：sleep_time（行动开始时间为 22-23 或 0-5 的夜晚）→
# 条件：game.time.hour >= 22 || game.time.hour <= 5（精确对应 erArk handle_sleep_time）。
# 原 10 条为夜间入睡描述；保留 1 条示例 + 1 条占位符。
[[entries]]
conditions = "game.time.hour >= 22 || game.time.hour <= 5"
context = "{player.name}在安静的夜晚躺下，听着窗外隐约的声响，慢慢闭上了眼睛。"

[[entries]]
conditions = "game.time.hour >= 22 || game.time.hour <= 5"
context = "睡觉指令通用口上 2"

# ── 白天组 ──────────────────────────────────────────────
# erArk 前提：time_day（行动开始时间为白天 6-17）→
# 条件：game.time.hour >= 6 && game.time.hour <= 17（精确对应 erArk handle_time_day）。
# 原 10 条为“白天也撑不住要睡”的描述；保留 1 条示例 + 1 条占位符。
[[entries]]
conditions = "game.time.hour >= 6 && game.time.hour <= 17"
context = "{player.name}明明还是白天，却已经困得睁不开眼，只好躺下休息。"

[[entries]]
conditions = "game.time.hour >= 6 && game.time.hour <= 17"
context = "睡觉指令通用口上 3"

# ── 疲劳爆表组 ──────────────────────────────────────────
# erArk 前提：tired_100（疲劳条 100%，当场爆睡）→
# 条件：player.疲劳度 >= 160（erArk handle_tired_100 的 tired_point/160 >= 1）。
# 原 26 条为“筋疲力尽直接倒下”的长文本；保留 1 条示例 + 1 条占位符。
[[entries]]
conditions = "player.疲劳度 >= 160"
context = "{player.name}已经筋疲力尽，再也撑不住，倒在床上瞬间就睡着了。"

[[entries]]
conditions = "player.疲劳度 >= 160"
context = "睡觉指令通用口上 4"