# h-core 默认配置
# state_ability: settle_state 计算时，用哪个能力等级作为系数
# key = 状态名（attributes.toml 中 category=parameter 的属性）
# value = 能力名（abilities.toml 中定义的带等级的能力）

[state_ability]
"润滑" = "欲望"
"习得" = "技巧"
"恭顺" = "顺从"
"好意" = "亲密"
"欲情" = "欲望"
"快乐" = "快乐刻印"
"先导" = "施虐"
"屈服" = "屈服刻印"
"羞耻" = "露出"
"苦痛" = "苦痛刻印"
"恐怖" = "恐怖刻印"
"反感" = "反发刻印"

# 性交体位表（erArk Sex_Position.csv 快感系数——体位修正用，h-core settle 读取）
# key = 体位 ID 1-12（与 h_state.current_sex_position 对应；-1=无体位 0.0，无需条目）
# pleasure_coefficient: 该体位对 V/A/U/W 部位快感的加法系数
[sex_positions]
1 = { name = "正常位", pleasure_coefficient = 0.0 }
2 = { name = "背后位", pleasure_coefficient = 0.1 }
3 = { name = "对面骑乘位", pleasure_coefficient = 0.1 }
4 = { name = "背面骑乘位", pleasure_coefficient = 0.2 }
5 = { name = "对面座位", pleasure_coefficient = -0.1 }
6 = { name = "背面座位", pleasure_coefficient = 0.0 }
7 = { name = "对面立位", pleasure_coefficient = 0.3 }
8 = { name = "背面立位", pleasure_coefficient = 0.4 }
9 = { name = "对面抱位", pleasure_coefficient = 0.5 }
10 = { name = "背面抱位", pleasure_coefficient = 0.6 }
11 = { name = "对面卧位", pleasure_coefficient = -0.3 }
12 = { name = "背面卧位", pleasure_coefficient = -0.2 }

# 饥饿系统配置（由 hunger-system 插件读取）
[hunger]
max = 240                       # 饥饿值上限
growth_per_min = 1.0            # 每分基础增长
growth_random = [0.8, 1.2]      # 随机波动范围
digestion_per_hour = 60         # 每小时消化速度(min)
npc_auto_eat_threshold = 190    # NPC 自动进食阈值(80%)
daily_ration_id = "干粮"        # NPC 每日口粮（空=不发放）
daily_ration_count = 1

# 口上系统配置（dialogue-system 读取，T3）
# common_mix_rate: 口上出现行为地文的概率（0-100，对齐 erArk draw_setting[13]×10，默认 30%）
[talk]
common_mix_rate = 30

# 特殊情境加权（T6，erArk handle_special_talk_weight，talk.py:168-223）
# 候选口上的前提集与某情境的 premises 有交集 → 权重 ×multiplier（每类最多一次，多类累计；
# erArk 默认 9 类 ×5）。mod 可覆盖/扩展
[[talk.situations]]
premises = ["self_time_stop_orgasm_relase", "target_time_stop_orgasm_relase"]
multiplier = 5

[[talk.situations]]
premises = ["self_is_player_daughter", "self_not_player_daughter"]
multiplier = 5

[[talk.situations]]
premises = ["h_in_love_hotel"]
multiplier = 5

[[talk.situations]]
premises = ["h_in_bathroom"]
multiplier = 5

[[talk.situations]]
premises = ["npc_active_h", "t_npc_active_h"]
multiplier = 5

[[talk.situations]]
premises = ["hidden_sex_mode_1", "hidden_sex_mode_2", "hidden_sex_mode_3", "hidden_sex_mode_4", "hidden_sex_mode_1_or_2", "hidden_sex_mode_3_or_4", "hidden_sex_mode_1_or_3", "hidden_sex_mode_2_or_4", "target_hidden_sex_mode_1", "target_hidden_sex_mode_2", "target_hidden_sex_mode_3", "target_hidden_sex_mode_4", "target_hidden_sex_mode_1_or_2", "target_hidden_sex_mode_3_or_4", "target_hidden_sex_mode_1_or_3", "target_hidden_sex_mode_2_or_4"]
multiplier = 5

[[talk.situations]]
premises = ["exhibitionism_sex_mode_1", "exhibitionism_sex_mode_2", "exhibitionism_sex_mode_3", "exhibitionism_sex_mode_4", "exhibitionism_sex_mode_ge_1", "target_exhibitionism_sex_mode_1", "target_exhibitionism_sex_mode_2", "target_exhibitionism_sex_mode_3", "target_exhibitionism_sex_mode_4"]
multiplier = 5

[[talk.situations]]
premises = ["group_sex_mode_on"]
multiplier = 5

[[talk.situations]]
premises = ["imprisonment_1", "t_imprisonment_1"]
multiplier = 5

# 实行判定特殊修正表（judge_class → 修正条目列表）
# 来源：erArk Script/Design/instuct_judege.py 逐行翻译（铁律：公式结构不可简化）
# 条件表达式用现有系统，target = 被判定角色（judge_check 注入 selectedCharacterId）
# 每条指令写 judge_class 时，calcJudge 自动查此表并叠加修正值
#
# 处女惩罚（instuct_judege.py 262-285 行，均需 target 无【性无知】天赋才生效）：
#   性交-250（阴道处女）/ A性交-350（肛门处女）/ W性交-400（子宫处女）
#   U性交-400（尿道处女）——尿道不做，不进入批次，仅记录
#   亲吻-125（初吻）——口交无判定惩罚（源码仅有询问确认，UI 层）
# 条件写法说明：破处状态在 first_times 命名空间（h-first-time 插件维护，true=已破），
#   与 erArk talent[0..4]（天赋存在=仍处）语义等价
#
# TODO 未实装修正项（不写死，对应系统实装后补）：
#   - 月经周期：性交/W性交 安全期-10 / 普通-50 / 危险-200 / 排卵-300（需 Reproduction_period 属性）
#     （豁免：妊娠合意 / 戴套 / 避孕中出合意+事前药 / 性无知）
#   - 体位喜欢 +30：性交/A性交/W性交 当前体位=喜好体位（需体位喜好天赋）
#   - 爱情旅馆 +25/50/100（h_in_love_hotel + 房型等级）
#   - 他人存在修正：25+25×n（S类 40+40×n，群交/隐奸 60+60×n）× 露出能力调整
#   - 助理助攻 +50（assistant_services[8]）
#   - 今天H被打断 -50×次数（h_interrupt）
#   - 监禁 +9999 / 睡眠 +9999（时停 +9999 已在 judge_check 内联处理）
#   - 激素系修正 +25/50/100（talent 304/305/306，施加方）
[judge.adjustments]
"性交" = [
  { condition = "target.first_times.virgin_V != true && target.talents.性无知 != 1", value = -250 },
]
"A性交" = [
  { condition = "target.first_times.virgin_A != true && target.talents.性无知 != 1", value = -350 },
]
"W性交" = [
  { condition = "target.first_times.virgin_W != true && target.talents.性无知 != 1", value = -400 },
]
"亲吻" = [
  { condition = "target.first_times.virgin_KISS != true && target.talents.性无知 != 1", value = -125 },
]
