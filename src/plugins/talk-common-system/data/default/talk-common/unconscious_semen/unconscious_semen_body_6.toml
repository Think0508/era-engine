# 无意识醒来精液口上（睡奸/时停/催眠通用——settle_unconscious_semen_and_cloth 触发）
# 来源：erArk data/talk/system/second_unconscious_semen.csv（2026-08-16 转换）
# 部位编号 = 引擎 BODY_PART_CID 体系（非 erArk 编号）：0 头发 1 面 2 嘴 3 胸 5 手 6 阴道
#   7 子宫 8 肛 9 脚 10 尿道 11 腿；erArk 映射 9→10 / 10→11 / 11→9；
#   跳过 4 腋 / 12 尾巴 / 13 角（引擎无对应部位，grill 定案）
# 触发：h-npc-ai getText('in_unconscious_cum_on_body_{引擎编号}', targetId) → {Name} 替换
# ⚠️ mod 可覆盖（talk-common 合并语义：mods/{mod}/definitions/talk-common/ 同名 variable 覆盖）
# 原文为第三人称"她"视角（方舟向）——武侠 mod 如需改人称/文风，覆盖本文件即可

# ── 阴道（引擎编号 6；erArk 6）──
variable = "in_unconscious_cum_on_body_6"
description = "无意识醒来发现该部位有精液的旁白（精液量分级选文）"

[[entries]]
conditions = "selected.body_semen.阴道.1 < 10"
context = "\n{Name}感到下体有一丝微妙的湿润感，她下意识地夹紧双腿，察觉到阴部有一种异样的滑腻触感。\n她小心翼翼地用手探向私密处，指尖轻轻触碰到一点微湿的液体。\n她收回手，发现指尖上沾着一小滴略带黏性的白色液体，不像是她自己的分泌物。\n那股淡淡的腥臊味告诉她这是什么，让她的脸瞬间变得苍白。\n她能感觉到那微小的精液量正缓慢地从阴唇间渗出，带着轻微的温热感，沿着大腿内侧蔓延。\n她匆忙擦拭私处和大腿，想要除去那些液体和气味，却发现那种黏腻的感觉似乎已经深入到了更私密的褶皱中，让她感到一阵恐慌和羞耻。\n"

[[entries]]
conditions = "selected.body_semen.阴道.1 >= 10 && selected.body_semen.阴道.1 < 50"
context = "\n{Name}感到下体传来明显的湿润感，一股温热的液体从她的阴道里缓缓流出。\n她惊慌地夹紧双腿，却只是让那些液体在她的私处扩散开来。\n她颤抖着伸手触摸，指尖立刻沾满了乳白色的粘稠液体。\n那些精液从她的阴唇间不断溢出，沿着会阴部和大腿内侧流淌，留下一道道白色的痕迹。\n她能清晰地感受到那种黏腻的触感，每动一下，那些液体就在她的阴唇和阴蒂周围滑动，带来一种难以言喻的异样感觉。\n那股浓烈的腥臊味从她的下体散发出来，让她既恶心又羞耻。\n她急忙掏出纸巾，反复擦拭私处和大腿，却发现那些精液源源不断地从阴道深处涌出，仿佛那里储存了一大滩似的，无论她怎么擦，总有新的液体流出来，让她陷入一种无望的清理循环。\n"

[[entries]]
conditions = "selected.body_semen.阴道.1 >= 50 && selected.body_semen.阴道.1 < 100"
context = "\n{Name}感到下体一阵剧烈的湿润感，随即一股温热的液体如同小喷泉一般从她的阴道里喷涌而出。\n她看着大量浓稠的白色精液从她的私密处源源不断地涌出，顺着她的大腿内侧一路流淌，甚至滴落到地板上，形成了一小滩白色水洼。\n她的整个阴部都被那些精液浸透了，从阴毛到阴唇，从阴蒂到会阴，无一幸免，就像是被浇了一大碗奶油一样。\n那种充盈感和流动感无比清晰，她能感觉到每一滴精液离开她体内的过程，带着一种湿润滑腻的触感。\n那股浓烈的腥臭味从她的下体散发出来，几乎让她作呕。\n她慌乱地用大量纸巾堵住自己的下体，试图阻止那不断涌出的液体，却发现那些精液已经浸透了纸巾，继续向外渗透。\n她不得不一次又一次地更换纸巾，同时疯狂地擦拭自己的大腿和私处，却始终无法阻止那源源不断从体内深处涌出的精液洪流。\n"

[[entries]]
conditions = "selected.body_semen.阴道.1 >= 100 && selected.body_semen.阴道.1 < 200"
context = "\n{Name}突然感到下体一阵强烈的压力，接着一股粘稠温热的液体从她的阴道深处猛烈地喷射而出。\n她双腿间瞬间被大量精液淹没，乳白色浑浊的体液喷溅在她的小腹、大腿甚至是胸部上，仿佛一个失控的消防栓正从她的私处喷射。\n阴道深处传来一阵阵挤压感，精液从里面一波一波地涌出，完全无法控制，那些液体从阴道深处冲刷而出的感觉清晰得令人恐惧。\n她的阴唇、阴蒂和整个外阴都被厚厚的精液覆盖，每一道褶皱都被灌满了白浊的液体，那些精液的量足以把她的整个下体变成一个滴落精液的水龙头。\n她能感受到精液的温度和令人作呕的腥味，那种味道如此浓烈，让她几乎窒息，同时下体被污染的感觉让她羞耻得想要尖叫。\n她颤抖着双手试图用衣物或纸巾堵住不断流出的液体，但精液的量实在太大，瞬间就浸透了所有吸收物，开始在地面上汇集成一个不断扩大的水洼。\n她徒劳地用手掌按压阴部，想要止住这羞耻的洪流，却反而让精液从指缝间喷出，每一次移动或者挤压都会带出新一波精液，伴随着令人面红耳赤的粘腻声响。\n"

[[entries]]
conditions = "selected.body_semen.阴道.1 >= 200"
context = "\n{Name}突然感到下体一阵剧烈的痛苦和胀满感，随即一股如同失禁般无法控制的液体从她的阴道喷涌而出，力道之大几乎把她推向后方。\n她低头看去，只见一股浓稠的精液瀑布从她的两腿之间不断喷出，在地上形成了一个迅速扩大的白色湖泊。\n阴道内部被撑到极限的感觉仍在持续，每一次抽搐都伴随着新一波精液从深处爆发出来，精液量多到令人无法想象。\n她的阴毛、阴唇甚至整个腹股沟和大腿都被浓稠的白色液体完全覆盖，黏腻的精液顺着她的腿部一路流到脚踝，在她周围形成了一圈精液的小河。\n那种被异物撑满然后喷发的感觉如此强烈，几乎让她双膝发软，站立不稳，而空气中那股浓烈到令人窒息的精液味道让她胃部翻腾，几欲呕吐。\n她疯狂地抓起所有能找到的纸巾试图阻止这场灾难，却徒劳无功，那些精液似乎无穷无尽，就像她的下体变成了一个永不停歇的精液喷泉。\n她羞耻得浑身发抖，恐惧地意识到自己可能需要数小时才能完全排空体内储存的所有精液，而每一滴都会提醒她遭受了怎样不堪的对待。\n"
