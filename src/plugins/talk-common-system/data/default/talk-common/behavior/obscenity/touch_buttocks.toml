# touch_buttocks 指令默认通用口上（插件默认层，Layer 1）
# ============================================================
# ⚠️ 骨架说明（2026-08-25）
# - erArk data/talk/obscenity/touch_buttocks.csv 原条目多按臀围/好感分支，不照搬。
#   默认层保留 high_1 通用组：1 示例 + 1 占位。
# - 占位符格式：「摸屁股指令通用口上 N」（N 连续编号）。
# - mod 可覆盖：mods/[模组名]/definitions/talk-common/ 下同路径文件覆盖本默认层。

variable = "touch_buttocks"
description = "摸屁股指令默认通用口上（角色通用口上 Layer 1 兜底，mod 可覆盖）"

# ── 高权重组 ──────────────────────────────────────────────
# erArk 前提：high_1（权重前提，恒通过、权重 1）→ 条件：premise(high_1)。
[[entries]]
conditions = "premise(high_1)"
context = "{player.name}轻轻覆上{character.name}的臀部，感受着掌下的弹性。"

[[entries]]
conditions = "premise(high_1)"
context = "摸屁股指令通用口上 1"