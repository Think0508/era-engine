[attributes]
# ════════════════════════════════════════
# 战斗属性（绑定系统用）
# ════════════════════════════════════════
hp = { type = "number", default = 100, category = "base", display = true, display_group = "status" }
mp = { type = "number", default = 50, category = "base", display = true, display_group = "status" }
attack = { type = "number", default = 10, category = "combat", display = true, display_group = "combat" }
defense = { type = "number", default = 5, category = "combat", display = true, display_group = "combat" }
speed = { type = "number", default = 5, category = "base", display = true, display_group = "base" }

# ════════════════════════════════════════
# BASE — 基础属性
# ════════════════════════════════════════
"体力" = { type = "number", default = 100, category = "base", display = true, display_group = "status" }
"气力" = { type = "number", default = 100, category = "base", display = true, display_group = "status" }
"精力" = { type = "number", default = 100, category = "base", display = true, display_group = "status" }
"疲劳度" = { type = "number", default = 0, category = "base", display = true, display_group = "status" }
"饥饿值" = { type = "number", default = 0, category = "base", display = true, display_group = "status" }
"熟睡值" = { type = "number", default = 0, category = "base", display = true, display_group = "status" }
"尿意" = { type = "number", default = 0, category = "base", display = true, display_group = "status" }
"体力上限" = { type = "number", default = 2500, category = "base", display = true, display_group = "status" }
"气力上限" = { type = "number", default = 2000, category = "base", display = true, display_group = "status" }
"欲望值" = { type = "number", default = 0, category = "base", display = true, display_group = "h" }
"射精槽" = { type = "number", default = 0, category = "base", display = true, display_group = "h" }
"射精槽上限" = { type = "number", default = 1000, category = "base", display = true, display_group = "h" }
"精液量" = { type = "number", default = 100, category = "base", display = true, display_group = "h" }
"精液量上限" = { type = "number", default = 100, category = "base", display = true, display_group = "h" }
"愤怒" = { type = "number", default = 0, category = "base", display = true, display_group = "emotion" }
"酒气" = { type = "number", default = 0, category = "base", display = true, display_group = "emotion" }

# ════════════════════════════════════════
# 情绪基调（不 daily_reset，长期积累）
# ════════════════════════════════════════
"情绪" = { type = "number", default = 50, category = "base", display = true, display_group = "emotion" }
"理性" = { type = "number", default = 100, category = "base", display = true, display_group = "emotion" }

# ── 性别（用于 sex 过滤）
"性别" = { type = "number", default = 0, category = "base", display = false }

# ════════════════════════════════════════
# PARAMETER — 行动参数（erark status_data[0..23] 等价物）
# 每日重置，10 级制 (level_thresholds 对齐 erark)
# 体感快感（9 部位，去尿道/兽部）
"皮肤" = { type = "number", default = 0, category = "parameter", display = true, display_group = "身体快感", daily_reset = true, level_thresholds = [0, 100, 500, 1000, 2500, 6000, 12000, 30000, 50000, 75000, 100000] }
"胸部" = { type = "number", default = 0, category = "parameter", display = true, display_group = "身体快感", daily_reset = true, level_thresholds = [0, 100, 500, 1000, 2500, 6000, 12000, 30000, 50000, 75000, 100000] }
"阴蒂" = { type = "number", default = 0, category = "parameter", display = true, display_group = "身体快感", daily_reset = true, level_thresholds = [0, 100, 500, 1000, 2500, 6000, 12000, 30000, 50000, 75000, 100000], sex = "female" }
"阴茎" = { type = "number", default = 0, category = "parameter", display = true, display_group = "身体快感", daily_reset = true, level_thresholds = [0, 100, 500, 1000, 2500, 6000, 12000, 30000, 50000, 75000, 100000], sex = "male" }
"阴道" = { type = "number", default = 0, category = "parameter", display = true, display_group = "身体快感", daily_reset = true, level_thresholds = [0, 100, 500, 1000, 2500, 6000, 12000, 30000, 50000, 75000, 100000], sex = "female" }
"后穴" = { type = "number", default = 0, category = "parameter", display = true, display_group = "身体快感", daily_reset = true, level_thresholds = [0, 100, 500, 1000, 2500, 6000, 12000, 30000, 50000, 75000, 100000] }
"子宫" = { type = "number", default = 0, category = "parameter", display = true, display_group = "身体快感", daily_reset = true, level_thresholds = [0, 100, 500, 1000, 2500, 6000, 12000, 30000, 50000, 75000, 100000], sex = "female" }
"口喉" = { type = "number", default = 0, category = "parameter", display = true, display_group = "身体快感", daily_reset = true, level_thresholds = [0, 100, 500, 1000, 2500, 6000, 12000, 30000, 50000, 75000, 100000] }
"心理" = { type = "number", default = 0, category = "parameter", display = true, display_group = "身体快感", daily_reset = true, level_thresholds = [0, 100, 500, 1000, 2500, 6000, 12000, 30000, 50000, 75000, 100000] }

# ════════════════════════════════════════
# 行为参数（情绪类 PALAM）
