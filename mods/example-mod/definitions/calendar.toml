# ═══════════════════════════════════════════════════════════════════
# definitions/calendar.toml —— 日历显示（可选，不写用引擎默认）
# 游戏时间显示用的名称表。month_names/weekday_names 必写则 12/7 个；
# hour_names 可选（十二时辰等文化名，按 24 小时索引）。
# ═══════════════════════════════════════════════════════════════════

[calendar]
month_names = ["正月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "冬月", "腊月"]
weekday_names = ["日", "一", "二", "三", "四", "五", "六"]
