# daily/social.toml——日常社交指令
# 注释：效果用 settle 公式，不硬编码数值。modify_attribute 仅用于特殊场景。

[[instructions]]
id = "chat"
label = "聊天"
type = "daily"
priority = 10
time_cost = 10
premises = ["HAVE_TARGET", "T_NORMAL"]
