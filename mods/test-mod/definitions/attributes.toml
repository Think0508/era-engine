"恐怖刻印" = { type = "number", default = 0, category = "mark", display = true, display_group = "刻印" }
"反发刻印" = { type = "number", default = 0, category = "mark", display = true, display_group = "刻印" }
"时姦刻印" = { type = "number", default = 0, category = "mark", display = true, display_group = "刻印" }
"无觉刻印" = { type = "number", default = 0, category = "mark", display = true, display_group = "刻印" }

# ════════════════════════════════════════
