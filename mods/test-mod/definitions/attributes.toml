"技巧" = { type = "number", default = 0, category = "ability", display = true, display_group = "性能力" }
"顺从" = { type = "number", default = 0, category = "ability", display = true, display_group = "性能力" }
"亲密" = { type = "number", default = 0, category = "ability", display = true, display_group = "性能力" }
"欲望" = { type = "number", default = 0, category = "ability", display = true, display_group = "性能力" }
"露出" = { type = "number", default = 0, category = "ability", display = true, display_group = "性能力" }
"施虐" = { type = "number", default = 0, category = "ability", display = true, display_group = "性能力" }
"受虐" = { type = "number", default = 0, category = "ability", display = true, display_group = "性能力" }

