# chat 指令失败链默认通用口上（插件默认层，Layer 1）
# ============================================================
# 语义：chat 指令失败链（talk_count > 话术技能+1）触发的口上场景 chat_failed；
#   erArk 中 CHAT_FAILED 为独立 behavior（口上文件 chat_failed.csv）。
# 来源: erArk data/talk/daily/chat_failed.csv 全量 28 条（1001-1028）
#   1001-1020 前提列 high_1（恒命中且权重均等 → 等价无条件均匀随机，故不写条件）
#   1021-1028 前提列 high_1&favorability_ge_3（NPC 对玩家好感等级 ≥3 才出）
# 占位符: {Name}→{player.name}（发起者） {TargetName}→{character.name}
# 约束：本目录（behavior/）只放非 H 行为默认口上；H 行为默认文本走行为地文（getBehaviorText）。

variable = "chat_failed"
description = "聊天指令失败链默认通用口上（mod 可覆盖）"

[[entries]]
context = "{player.name}和{character.name}尝试聊天，但是由于彼此不熟悉，气氛很尴尬。"

