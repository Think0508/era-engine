# ════════════════════════════════════════
# 示范：mod 自定义属性（标准角色契约 spec §10.1 —— mod 扩展规则演示）
# 气血/内力：武侠世界观通用属性，condition-registry 测试引用（player.气血 < 30 等）。
# 按契约：mod 新增属性必须经 definitions/attributes.toml 定义，禁止角色数据裸字段。
# ════════════════════════════════════════
"气血" = { type = "number", default = 100, category = "base", display = true, display_group = "status", description = "武侠概念属性（test-mod 示范：mod 自定义属性）" }
"内力" = { type = "number", default = 50, category = "base", display = true, display_group = "status", description = "武侠概念属性（test-mod 示范：mod 自定义属性）" }

# 阴茎大小（jj_0~3 前提数据源——h-ejaculation 角色注册时按分布初始化，默认 1 档）
"阴茎大小" = { type = "number", default = 1, category = "body", display = false, description = "阴茎大小档位（0-3），jj_0~3 前提判定" }

# ════════════════════════════════════════
# 属性有效值层 E2E 夹具（2026-09-22）
# compute 声明 + scripts/calc_derived_test.js：让 src/core/mod-loader.test.ts 走**真实 loadMod**
# 验证「定义注入 + scripts.get(fileName) 键位 + 派生读取」这条缝（此前零覆盖）。
# display = false（不进 UI 列表）；无任何生产消费方读取它。
# ════════════════════════════════════════
"派生测试值" = { type = "number", default = 0, category = "base", display = false, compute = "calc_derived_test.js", description = "属性有效值层 E2E 夹具（派生公式 = base + 根骨×10）" }

# 属性有效值层 计划二夹具（2026-09-22）：声明式来源（装备/被动技能/天赋的 attribute_mods）
# E2E 用（src/core/mod-loader.test.ts）。display = false（不进 UI 列表）；无生产消费方读取它。
"修正测试值" = { type = "number", default = 100, category = "base", display = false, description = "属性有效值层 E2E 夹具（声明式修正来源：无来源时 = 裸值 100）" }

# ════════════════════════════════════════
