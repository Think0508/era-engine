effects = [
  # 21 ADD_INTERACTION_FAVORABILITY
  { type = "settle_favorability" },
  # 11 DOWN_BOTH_SMALL_HIT_POINT：双方体力 -1/分
  { type = "settle_hp_mp", target = "self", params = { hpValue = -1, mpValue = 0 } },
  { type = "settle_hp_mp", target = "selected", params = { hpValue = -1, mpValue = 0 } },
  # 12 DOWN_BOTH_SMALL_MANA_POINT：双方气力 -3/分
