  { from = 5, to = 7, min = 1, max = 3 },
  { from = 7, to = 9, min = 1, max = 4 },
  { from = 9, to = 99, min = 1, max = 5 },
]
auto_growth = [ { attr = "武学常识", flat = 2 } ]

